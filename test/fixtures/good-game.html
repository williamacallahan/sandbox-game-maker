<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
body { margin: 0; overflow: hidden; width: 100vw; height: 100vh; }
#overlay { position: fixed; inset: 0; background: #000; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
<div id="overlay" data-game-overlay>
  <button id="start">Start</button>
</div>
<canvas id="c"></canvas>
<script>
document.getElementById('start').addEventListener('click', () => {
  document.getElementById('overlay').style.display = 'none';
});
document.getElementById('c').addEventListener('pointerdown', () => {});
window.addEventListener('message', (e) => {
  if (e.data && e.data.type === 'game-maker:dismiss-overlay') {
    document.getElementById('overlay').style.display = 'none';
  }
});
</script>
</body>
</html>

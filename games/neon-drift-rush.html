<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Neon Drift Rush</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100vw;height:100vh;overflow:hidden;background:#070b18;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}#wrap{position:relative;width:100vw;height:100vh;overflow:hidden}canvas{display:block;width:100vw;height:100vh;touch-action:none}#hud{position:absolute;top:3.5%;left:4%;right:4%;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;text-shadow:0 2px 5px #000}.label{font-size:clamp(10px,2.2vw,15px);letter-spacing:.16em;color:#8ea4c9;font-weight:700}.value{font-size:clamp(20px,5vw,36px);font-weight:900;line-height:1.05}.accent{color:#63f5ff}.pink{color:#ff4fa3}#pauseBtn{pointer-events:auto;border:1px solid #6cf5ff;background:#0a1930cc;color:#bffaff;border-radius:999px;padding:9px 15px;font-size:clamp(11px,2.5vw,15px);font-weight:800;letter-spacing:.08em;cursor:pointer;box-shadow:0 0 14px #00d9ff44}#pauseBtn:active{transform:scale(.96)}#tip{position:absolute;bottom:3%;left:0;right:0;text-align:center;color:#9bb0d2;font-size:clamp(10px,2.4vw,14px);opacity:.85;pointer-events:none}.overlay{position:absolute;inset:0;display:none;place-items:center;background:#050816aa;backdrop-filter:blur(5px);z-index:5}.overlay.show{display:grid}.card{width:min(78vw,360px);padding:28px 22px;text-align:center;border:1px solid #5defff;background:linear-gradient(145deg,#111d3eee,#081128ee);border-radius:22px;box-shadow:0 0 35px #00ddff44}.card h1{margin:0 0 7px;font-size:clamp(26px,8vw,42px);color:#74f7ff}.card p{margin:7px 0 20px;color:#b6c7e7}.resume{border:0;border-radius:999px;padding:12px 24px;background:#ff4fa3;color:white;font-weight:900;font-size:15px;cursor:pointer;box-shadow:0 0 20px #ff4fa366}
</style></head><body><div id="wrap"><canvas id="game"></canvas><div id="hud"><div><div class="label">DISTANCE</div><div class="value accent" id="dist">0m</div></div><div style="text-align:right"><div class="label">BEST RUN</div><div class="value pink" id="best">0m</div></div><button id="pauseBtn" aria-label="Pause game">Ⅱ PAUSE</button></div><div id="tip">← → / A D to steer &nbsp; • &nbsp; dodge the neon traffic</div><div class="overlay" data-game-overlay id="pauseOverlay"><div class="card"><h1>RACE PAUSED</h1><p>Catch your breath, racer.</p><button class="resume" id="resumeBtn">RESUME</button></div></div></div>
<script>
(()=>{const c=document.getElementById('game'),x=c.getContext('2d'),distEl=document.getElementById('dist'),bestEl=document.getElementById('best'),pauseBtn=document.getElementById('pauseBtn'),overlay=document.getElementById('pauseOverlay'),resumeBtn=document.getElementById('resumeBtn');let W,H,dpr,road,player,traffic,particles,keys={},running=true,dead=false,last=0,distance=0,best=0,spawn=0,shake=0;
function resize(){dpr=Math.min(2,devicePixelRatio||1);W=window.innerWidth;H=window.innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);road={cx:W/2,w:Math.min(W*.72,430),top:0,bottom:H};if(player){player.y=H*.78;player.x=Math.max(road.cx-road.w/2+player.w/2,Math.min(road.cx+road.w/2-player.w/2,player.x));}}
function reset(){distance=0;traffic=[];particles=[];dead=false;running=true;player={x:W/2,y:H*.78,w:Math.max(22,W*.075),h:Math.max(42,H*.09),vx:0,tilt:0};}
function laneX(lane){return road.cx-road.w/2+road.w*(lane+.5)/3}function addCar(){let lane=Math.floor(Math.random()*3),size=Math.max(22,W*.065);traffic.push({x:laneX(lane),y:-size*2,w:size,h:size*1.65,speed:1+Math.random()*1.5,color:['#ff4fa3','#ffce54','#a66cff','#48f5c4'][Math.floor(Math.random()*4)],lane})}function burst(){for(let i=0;i<25;i++)particles.push({x:player.x+(Math.random()-.5)*20,y:player.y,dx:(Math.random()-.5)*5,dy:(Math.random()-.5)*5,life:1,c:'#ff4fa3'})}
function togglePause(){if(dead)return;running=!running;overlay.classList.toggle('show',!running);pauseBtn.textContent=running?'Ⅱ PAUSE':'▶ PLAY'}function resume(){if(!dead){running=true;overlay.classList.remove('show');pauseBtn.textContent='Ⅱ PAUSE'}}function end(){dead=true;running=false;best=Math.max(best,Math.floor(distance));bestEl.textContent=best+'m';burst();overlay.querySelector('h1').textContent='CRASHED!';overlay.querySelector('p').textContent='Distance: '+Math.floor(distance)+'m — tap resume to race again.';resumeBtn.textContent='RACE AGAIN';overlay.classList.add('show')}
function update(dt){if(dead)return;let steer=(keys.ArrowLeft||keys.a?-1:0)+(keys.ArrowRight||keys.d?1:0);player.vx+=(steer*1.2-player.vx)*Math.min(1,dt*9);player.x+=player.vx*dt*60;player.x=Math.max(road.cx-road.w/2+player.w/2,Math.min(road.cx+road.w/2-player.w/2,player.x));player.tilt=player.vx*.08;distance+=dt*18;distEl.textContent=Math.floor(distance)+'m';spawn-=dt;if(spawn<=0){addCar();spawn=Math.max(.32,.82-distance/700)+Math.random()*.3}let speed=(5.5+distance*.012)*dt*60;traffic.forEach(a=>a.y+=speed*a.speed);traffic=traffic.filter(a=>a.y<H+80);for(const a of traffic)if(Math.abs(a.x-player.x)<(a.w+player.w)*.39&&Math.abs(a.y-player.y)<(a.h+player.h)*.4)end();for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.dx*dt*60;p.y+=p.dy*dt*60;p.life-=dt*2;if(p.life<=0)particles.splice(i,1)}shake=Math.max(0,shake-dt*2)}
function roundedRect(ctx,xx,yy,w,h,r){ctx.beginPath();ctx.roundRect(xx,yy,w,h,r);ctx.fill()}function drawCar(a,isPlayer){x.save();x.translate(a.x,a.y);if(isPlayer)x.rotate(a.tilt);x.shadowBlur=16;x.shadowColor=isPlayer?'#56f5ff':a.color;x.fillStyle=isPlayer?'#23dbea':a.color;roundedRect(x,-a.w/2,-a.h/2,a.w,a.h,a.w*.25);x.shadowBlur=0;x.fillStyle='#10182d';roundedRect(x,-a.w*.32,-a.h*.18,a.w*.64,a.h*.3,a.w*.1);x.fillStyle='#bdfbff';x.globalAlpha=.8;roundedRect(x,-a.w*.28,-a.h*.11,a.w*.56,a.h*.13,a.w*.05);x.globalAlpha=1;x.fillStyle=isPlayer?'#ffed75':'#ff668c';x.fillRect(-a.w*.38,a.h*.29,a.w*.2,a.h*.08);x.fillRect(a.w*.18,a.h*.29,a.w*.2,a.h*.08);x.restore()}
function draw(t){let s=shake?(Math.random()-.5)*shake*5:0;x.save();x.translate(s,s);let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#111b3b');g.addColorStop(1,'#070b18');x.fillStyle=g;x.fillRect(-s,-s,W,H);x.fillStyle='#18264c';for(let i=0;i<18;i++){let yy=(i*97+t*.04)%H;x.fillRect(W*.08+(i*53)%Math.max(1,W*.84),yy,2,2)}x.fillStyle='#0c1328';x.fillRect(road.cx-road.w/2,0,road.w,H);x.strokeStyle='#304a72';x.lineWidth=3;x.strokeRect(road.cx-road.w/2,0,road.w,H);x.setLineDash([H*.045,H*.045]);x.lineDashOffset=-(t*.28%H);x.strokeStyle='#56729b';x.lineWidth=3;for(let i=1;i<3;i++){let xx=road.cx-road.w/2+road.w*i/3;x.beginPath();x.moveTo(xx,0);x.lineTo(xx,H);x.stroke()}x.setLineDash([]);traffic.forEach(a=>drawCar(a,false));drawCar(player,true);particles.forEach(p=>{x.globalAlpha=p.life;x.fillStyle=p.c;x.fillRect(p.x,p.y,4,4)});x.restore()}
function loop(t){let dt=Math.min(.035,(t-last)/1000||0);last=t;if(running)update(dt);draw(t);requestAnimationFrame(loop)}
addEventListener('resize',resize);addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key==='p'||e.key==='P'||e.key===' ')togglePause()});addEventListener('keyup',e=>keys[e.key]=false);pauseBtn.addEventListener('click',togglePause);resumeBtn.addEventListener('click',()=>{if(dead){reset();overlay.classList.remove('show');pauseBtn.textContent='Ⅱ PAUSE'}else resume()});addEventListener('message',e=>{if(e.data&&e.data.type==='game-maker:dismiss-overlay')resume()});resize();reset();requestAnimationFrame(loop)})();
</script></body></html>

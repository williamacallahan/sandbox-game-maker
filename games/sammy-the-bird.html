<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Sammy the Bird — Big Sky Adventure (by V Moua)</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: #7ec8f0; }
  body { font-family: Georgia, "Times New Roman", serif; touch-action: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #over {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: rgba(12, 24, 36, .58); z-index: 5; padding: 4vmin;
  }
  #over[hidden] { display: none; }
  .card {
    background: #fff5e0; border: 4px solid #3b2a1a; border-radius: 18px;
    box-shadow: 0 12px 0 rgba(0,0,0,.35); color: #3b2a1a;
    max-width: min(430px, 90vw); padding: 5vmin 5vmin; text-align: center;
  }
  .card h1 { margin: 0 0 2px; font-size: clamp(20px, 6vw, 30px); letter-spacing: .5px; }
  .card .by { margin: 0 0 12px; font-size: 12px; font-style: italic; opacity: .8; letter-spacing: .6px; }
  .stat { display: flex; justify-content: space-between; font-size: 15px; padding: 4px 0; border-bottom: 1px dashed #c9b18c; }
  .stat b { font-size: 17px; }
  .note { font-size: 14px; margin: 12px 0 14px; line-height: 1.35; }
  button {
    font-family: inherit; font-size: 17px; cursor: pointer;
    background: #ffb02e; color: #3b2a1a; border: 3px solid #3b2a1a;
    border-radius: 12px; padding: 10px 22px; box-shadow: 0 4px 0 #3b2a1a;
  }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 #3b2a1a; }
  .hint { font-size: 11px; margin: 10px 0 0; opacity: .75; letter-spacing: .5px; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="over" data-game-overlay hidden>
  <div class="card">
    <h1 id="ttl">Sammy tumbles!</h1>
    <p class="by">a Sammy the Bird adventure &middot; by V Moua</p>
    <div class="stat"><span>Adventure score</span><b id="sc">0</b></div>
    <div class="stat"><span>Golden berries</span><b id="be">0</b></div>
    <div class="stat" style="border-bottom:none"><span>Best flight</span><b id="bst">0</b></div>
    <p class="note" id="quip">The worms are still out there.</p>
    <button id="again">Fly again</button>
    <p class="hint">SPACE / CLICK / TAP to flap</p>
  </div>
</div>

<script>
(function () {
  "use strict";
  var cvs = document.getElementById('c'), ctx = cvs.getContext('2d');
  var W = 0, H = 0, DPR = 1, groundY = 0;
  var over = document.getElementById('over');
  var elSc = document.getElementById('sc'), elBe = document.getElementById('be'),
      elBst = document.getElementById('bst'), elTtl = document.getElementById('ttl'),
      elQuip = document.getElementById('quip');

  function resize() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    cvs.width = Math.round(W * DPR); cvs.height = Math.round(H * DPR);
    cvs.style.width = W + 'px'; cvs.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    groundY = H - Math.max(54, H * 0.11);
  }
  window.addEventListener('resize', resize); resize();

  /* ---------- tiny web-audio blips (no network) ---------- */
  var AC = null;
  function sfx(freq, dur, type, vol, slideTo) {
    try {
      if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
      var o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
      o.type = type || 'square'; o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(40, slideTo), t + dur);
      g.gain.setValueAtTime(vol || 0.05, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + 0.02);
    } catch (e) {}
  }

  function rnd(a, b) { return a + Math.random() * (b - a); }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

  /* ---------- game state ---------- */
  var best = 0;
  var b = { y: 0, vy: 0, rot: 0, wing: 0, flapT: 0 };
  var obstacles, hazards, berries, parts, hills;
  var dist, speed, state, deadT, shake, nextOb, nextBery, nextHaz, sinceOb, sinceBery;
  var berryCount, hintT, tAll = 0;

  function reset() {
    b.y = H * 0.42; b.vy = -160; b.rot = 0; b.wing = 0; b.flapT = 0;
    obstacles = []; hazards = []; berries = []; parts = [];
    dist = 0; speed = 208; state = 'play'; deadT = 0; shake = 0;
    nextOb = 260; nextBery = 140; nextHaz = 1500; sinceOb = 0; sinceBery = 0;
    berryCount = 0; hintT = 3.4;
  }
  reset();

  function birdX() { return W * 0.30; }
  function score() { return Math.floor(dist / 11) + berryCount * 5; }

  function flap() {
    if (state === 'dead') return;
    b.vy = -432; b.flapT = 0.26; hintT = Math.min(hintT, 0.5);
    sfx(520, 0.09, 'triangle', 0.05, 300);
    for (var i = 0; i < 3; i++) {
      parts.push({ x: birdX() - 12, y: b.y + 6, vx: rnd(-70, -20), vy: rnd(-20, 60),
        life: rnd(.3, .5), t: 0, r: rnd(1.5, 3), c: 'rgba(255,255,255,.7)' });
    }
  }

  function die(reason) {
    if (state === 'dead') return;
    state = 'dead'; deadT = 0; shake = 1;
    best = Math.max(best, score());
    sfx(240, 0.32, 'sawtooth', 0.06, 70);
    for (var i = 0; i < 16; i++) {
      parts.push({ x: birdX(), y: b.y, vx: rnd(-190, 150), vy: rnd(-260, -30),
        life: rnd(.7, 1.4), t: 0, r: rnd(2.5, 5), c: i % 3 ? '#8fd0f5' : '#fff5e0', feather: true });
    }
    var quips = [
      '“Every great bird has bumpy landings,” wrote V Moua.',
      'The worms are still out there, Sammy.',
      'That branch had a head start.',
      'Flight rule #1: the ground always wins ties.',
      'Sammy will need more berries before retrying.'
    ];
    elTtl.textContent = reason === 'ground' ? 'Sammy hit the dirt!' : 'Sammy tumbles!';
    elQuip.textContent = quips[Math.floor(Math.random() * quips.length)];
    elSc.textContent = score(); elBe.textContent = berryCount; elBst.textContent = best;
    setTimeout(function () { if (state === 'dead') over.hidden = false; }, 650);
  }

  /* ---------- world generation ---------- */
  function spawn() {
    var gs = Math.max(162, 252 - dist * 0.012);
    var top = rnd(58, Math.max(70, groundY - gs - 66));
    var w = clamp(W * 0.10, 46, 76);
    obstacles.push({ x: W + 40, gapTop: top, gapBot: top + gs, w: w, seed: Math.random() * 9 });
  }
  function spawnBerries() {
    var n = 3 + Math.floor(Math.random() * 3);
    var baseY = rnd(90, groundY - 110);
    var arc = Math.random() < 0.5 ? 1 : 0;
    for (var i = 0; i < n; i++) {
      berries.push({ x: W + 30 + i * 44, y: baseY - (arc ? Math.sin(i / (n - 1) * Math.PI) * 74 : 0), t: Math.random() * 6, got: 0 });
    }
  }
  function spawnHaz() {
    var y0 = rnd(120, groundY - 150);
    hazards.push({ x: W + 60, y0: y0, amp: rnd(40, 90), ph: Math.random() * 6, r: 30, t: 0 });
  }

  /* ---------- update ---------- */
  function update(dt) {
    tAll += dt;
    if (hintT > 0) hintT -= dt;
    if (shake > 0) shake = Math.max(0, shake - dt * 3.2);

    if (state === 'play') {
      speed = Math.min(400, 208 + dist * 0.020);
      dist += speed * dt;

      b.vy += 1500 * dt;
      b.y += b.vy * dt;
      if (b.y < 16) { b.y = 16; b.vy = Math.max(b.vy, 60); }
      b.rot = clamp(b.vy / 620, -0.5, 1.15);
      b.flapT = Math.max(0, b.flapT - dt);
      b.wing += dt * (b.flapT > 0 ? 26 : 9);

      sinceOb += speed * dt;
      if (sinceOb > nextOb) { sinceOb = 0; nextOb = rnd(300, 420) - Math.min(90, dist * 0.006); spawn(); }
      sinceBery += speed * dt;
      if (sinceBery > nextBery) { sinceBery = 0; nextBery = rnd(430, 700); spawnBerries(); }
      nextHaz -= speed * dt;
      if (dist > 900 && nextHaz <= 0) { nextHaz = rnd(1200, 1900); spawnHaz(); }

      var i, o;
      for (i = obstacles.length - 1; i >= 0; i--) {
        o = obstacles[i]; o.x -= speed * dt;
        if (o.x + o.w < -20) obstacles.splice(i, 1);
      }
      for (i = hazards.length - 1; i >= 0; i--) {
        o = hazards[i]; o.x -= (speed + 46) * dt; o.t += dt;
        if (o.x < -70) hazards.splice(i, 1);
      }
      for (i = berries.length - 1; i >= 0; i--) {
        o = berries[i]; o.x -= speed * dt; o.t += dt;
        if (o.x < -30) { berries.splice(i, 1); continue; }
        var dx = o.x - birdX(), dy = o.y - b.y;
        if (dx * dx + dy * dy < 30 * 30) {
          berries.splice(i, 1); berryCount++;
          sfx(880 + berryCount * 4, 0.10, 'square', 0.045, 1500);
          for (var k = 0; k < 9; k++) parts.push({ x: o.x, y: o.y, vx: rnd(-120, 120), vy: rnd(-140, 60),
            life: rnd(.25, .55), t: 0, r: rnd(1.5, 3), c: '#ffd75e' });
        }
      }
      // collisions
      var bx = birdX(), br = 12.5;
      if (b.y + br > groundY) { b.y = groundY - br; die('ground'); }
      for (i = 0; i < obstacles.length; i++) {
        o = obstacles[i];
        if (hit(bx, b.y, br, o.x, -60, o.w, o.gapTop + 60) ||
            hit(bx, b.y, br, o.x, o.gapBot, o.w, groundY - o.gapBot + 60)) { die('branch'); break; }
      }
      for (i = 0; i < hazards.length; i++) {
        o = hazards[i];
        var hy = o.y0 + Math.sin(o.t * 1.7 + o.ph) * o.amp;
        var ddx = o.x - bx, ddy = hy - b.y;
        if (ddx * ddx + ddy * ddy < (o.r + br - 6) * (o.r + br - 6)) { die('storm'); break; }
      }
    } else {
      deadT += dt;
      b.vy += 900 * dt; b.y += b.vy * dt;
      b.rot = Math.min(1.6, b.rot + dt * 3.4);
      if (b.y > groundY - 12) { b.y = groundY - 12; b.vy = 0; }
    }

    for (var p = parts.length - 1; p >= 0; p--) {
      var q = parts[p]; q.t += dt;
      q.vy += (q.feather ? 420 : 260) * dt;
      q.x -= (state === 'play' ? speed * dt : 0);
      q.x += q.vx * dt; q.y += q.vy * dt;
      if (q.t > q.life) parts.splice(p, 1);
    }
  }

  function hit(cx, cy, r, x, y, w, h) {
    var nx = clamp(cx, x, x + w), ny = clamp(cy, y, y + h);
    var dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy < r * r;
  }

  /* ---------- drawing ---------- */
  function drawSky() {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#69bbee'); g.addColorStop(.55, '#a8dcf5'); g.addColorStop(1, '#ffe9bd');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // sun
    ctx.save(); ctx.globalAlpha = .9;
    var sx = W * 0.82, sy = H * 0.17;
    var rg = ctx.createRadialGradient(sx, sy, 6, sx, sy, 90);
    rg.addColorStop(0, 'rgba(255,240,180,1)'); rg.addColorStop(1, 'rgba(255,220,120,0)');
    ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(sx, sy, 90, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff2b8'; ctx.beginPath(); ctx.arc(sx, sy, 30, 0, 7); ctx.fill();
    ctx.restore();
    // drifting clouds
    for (var i = 0; i < 6; i++) {
      var cw = 150 + (i % 3) * 60;
      var cx = ((i * 373 - dist * 0.16 - tAll * 9) % (W + 400) + W + 400) % (W + 400) - 200;
      var cy = 40 + ((i * 97) % (H * 0.42));
      ctx.fillStyle = 'rgba(255,255,255,.72)';
      puff(cx, cy, cw * 0.36, [0, .28, .55, .8]);
    }
  }
  function puff(x, y, r, offs) {
    ctx.beginPath();
    for (var i = 0; i < offs.length; i++) ctx.arc(x + offs[i] * r * 2.2, y + Math.sin(i * 2.1) * r * 0.24, r * (1 - i * 0.1), 0, 7);
    ctx.fill();
  }
  function drawHills() {
    var layers = [
      { col: '#7fb98a', off: 0.22, amp: 46, y: groundY - 62, per: 620 },
      { col: '#5fa472', off: 0.42, amp: 34, y: groundY - 34, per: 420 }
    ];
    for (var l = 0; l < layers.length; l++) {
      var L = layers[l];
      ctx.fillStyle = L.col; ctx.beginPath(); ctx.moveTo(0, groundY + 4);
      for (var x = 0; x <= W; x += 14) {
        var wx = x + dist * L.off;
        var y = L.y - Math.sin(wx / L.per * Math.PI * 2) * L.amp - Math.sin(wx / (L.per * 0.37) * 6.28) * L.amp * 0.25;
        ctx.lineTo(x, y);
      }
      ctx.lineTo(W, groundY + 4); ctx.closePath(); ctx.fill();
    }
  }
  function drawGround() {
    ctx.fillStyle = '#4e8f4a'; ctx.fillRect(0, groundY, W, H - groundY);
    ctx.fillStyle = '#61a95a'; ctx.fillRect(0, groundY, W, 9);
    ctx.fillStyle = '#3f7a3d';
    for (var i = 0; i < 26; i++) {
      var gx = ((i * 91 - dist * 1) % (W + 90) + W + 90) % (W + 90) - 45;
      ctx.fillRect(gx, groundY + 14 + (i % 3) * 11, 22, 3);
    }
    // seed/flower dots
    ctx.fillStyle = '#ffd75e';
    for (var j = 0; j < 14; j++) {
      var fx = ((j * 149 - dist * 1) % (W + 60) + W + 60) % (W + 60) - 30;
      ctx.beginPath(); ctx.arc(fx, groundY + 26 + (j % 4) * 8, 2.4, 0, 7); ctx.fill();
    }
  }
  function drawBranch(o) {
    var g = ctx.createLinearGradient(o.x, 0, o.x + o.w, 0);
    g.addColorStop(0, '#6b4a2b'); g.addColorStop(.4, '#8a6238'); g.addColorStop(1, '#4d3320');
    ctx.fillStyle = g;
    var r = Math.min(12, o.w / 2);
    ctx.fillRect(o.x, -60, o.w, o.gapTop + 60);
    ctx.fillRect(o.x, o.gapBot, o.w, groundY - o.gapBot + 60);
    // knots
    ctx.fillStyle = 'rgba(60,38,18,.45)';
    ctx.beginPath(); ctx.ellipse(o.x + o.w * .45, o.gapTop - 34, 6, 11, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(o.x + o.w * .55, o.gapBot + 40, 5, 9, 0, 0, 7); ctx.fill();
    // leaf clusters at gap edges
    leafy(o.x + o.w / 2, o.gapTop, 1, o.seed);
    leafy(o.x + o.w / 2, o.gapBot, -1, o.seed + 2);
  }
  function leafy(x, y, dir, seed) {
    ctx.fillStyle = '#3f9a4f';
    for (var i = 0; i < 5; i++) {
      var a = seed + i * 1.7;
      ctx.beginPath();
      ctx.arc(x + Math.cos(a) * 26, y + dir * (Math.abs(Math.sin(a)) * 16 + 6), 15 + (i % 2) * 6, 0, 7);
      ctx.fill();
    }
    ctx.fillStyle = '#5ec26a';
    for (i = 0; i < 4; i++) {
      a = seed * 1.3 + i * 2.2;
      ctx.beginPath(); ctx.arc(x + Math.cos(a) * 20, y + dir * (Math.abs(Math.sin(a)) * 12 + 3), 9, 0, 7); ctx.fill();
    }
  }
  function drawHaz(o) {
    var y = o.y0 + Math.sin(o.t * 1.7 + o.ph) * o.amp;
    ctx.save(); ctx.translate(o.x, y);
    ctx.fillStyle = '#5b6472';
    puff(-28, -2, 19, [0, .3, .62, .9]);
    ctx.fillStyle = '#727d8d'; puff(-24, -10, 15, [0, .35, .7]);
    ctx.fillStyle = '#3b424d';
    ctx.beginPath(); ctx.ellipse(-20, -4, 5, 4, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, -4, 5, 4, 0, 0, 7); ctx.fill();
    // grumpy brows
    ctx.strokeStyle = '#2c323a'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-26, -13); ctx.lineTo(-14, -9);
    ctx.moveTo(6, -9); ctx.lineTo(18, -13); ctx.stroke();
    // zap
    if (Math.sin(o.t * 5) > 0.7) {
      ctx.fillStyle = '#ffe066'; ctx.beginPath();
      ctx.moveTo(-2, 12); ctx.lineTo(6, 12); ctx.lineTo(1, 24); ctx.lineTo(11, 22);
      ctx.lineTo(3, 40); ctx.lineTo(6, 24); ctx.lineTo(-3, 26); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }
  function drawBery(o) {
    var y = o.y + Math.sin(o.t * 3) * 4;
    ctx.save(); ctx.translate(o.x, y);
    var rg = ctx.createRadialGradient(0, 0, 2, 0, 0, 20);
    rg.addColorStop(0, 'rgba(255,225,120,.85)'); rg.addColorStop(1, 'rgba(255,215,90,0)');
    ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(0, 0, 20, 0, 7); ctx.fill();
    ctx.fillStyle = '#e0a417';
    [[-5, 2], [5, 3], [0, -4]].forEach(function (p) { ctx.beginPath(); ctx.arc(p[0], p[1], 5.2, 0, 7); ctx.fill(); });
    ctx.fillStyle = '#ffdc7a';
    ctx.beginPath(); ctx.arc(-6.4, 0.4, 2, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(3.6, 1.4, 1.7, 0, 7); ctx.fill();
    ctx.fillStyle = '#3f9a4f'; ctx.beginPath(); ctx.ellipse(2, -9, 6, 3, -0.5, 0, 7); ctx.fill();
    ctx.restore();
  }
  function drawSammy() {
    var x = birdX(), y = b.y;
    ctx.save(); ctx.translate(x, y);
    // scarf trail (behind)
    ctx.save(); ctx.rotate(b.rot * 0.35);
    for (var i = 4; i >= 0; i--) {
      var w = 1 - i / 5;
      ctx.fillStyle = i % 2 ? '#ef4b4b' : '#ff6b6b';
      ctx.fillRect(-16 - i * 9, -2 + Math.sin(tAll * 9 - i * 0.9) * 5 * w, 10, 7 * w + 2);
    }
    ctx.restore();
    ctx.rotate(b.rot);
    // tail
    ctx.fillStyle = '#2b7bb8';
    ctx.beginPath(); ctx.moveTo(-11, -3); ctx.lineTo(-27, -11); ctx.lineTo(-25, 4); ctx.closePath(); ctx.fill();
    // body
    var bg = ctx.createLinearGradient(0, -14, 0, 14);
    bg.addColorStop(0, '#63bdf0'); bg.addColorStop(1, '#2f83c0');
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.ellipse(0, 0, 17, 13, 0, 0, 7); ctx.fill();
    // belly
    ctx.fillStyle = '#fff0cd';
    ctx.beginPath(); ctx.ellipse(1, 6, 11, 7, 0, 0, 7); ctx.fill();
    // wing
    var wa = b.flapT > 0 ? Math.sin(b.wing) * 1.05 : Math.sin(b.wing * 0.6) * 0.35 - 0.15;
    ctx.save(); ctx.translate(-1, -2); ctx.rotate(wa);
    ctx.fillStyle = '#2b7bb8';
    ctx.beginPath(); ctx.ellipse(0, -8, 9, 14, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#8fd0f5';
    ctx.beginPath(); ctx.ellipse(0, -5, 5.5, 8, 0, 0, 7); ctx.fill();
    ctx.restore();
    // head
    ctx.fillStyle = '#63bdf0';
    ctx.beginPath(); ctx.arc(11, -9, 10.5, 0, 7); ctx.fill();
    // crest
    ctx.fillStyle = '#2b7bb8';
    ctx.beginPath(); ctx.moveTo(8, -18); ctx.lineTo(4, -27); ctx.lineTo(13, -20); ctx.closePath(); ctx.fill();
    // scarf around neck
    ctx.strokeStyle = '#ef4b4b'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(3, -2); ctx.lineTo(15, -1); ctx.stroke();
    // beak
    ctx.fillStyle = '#ffb02e';
    ctx.beginPath(); ctx.moveTo(20, -10); ctx.lineTo(31, -7.5); ctx.lineTo(20, -4.5); ctx.closePath(); ctx.fill();
    // eye
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(14.5, -11.5, 4, 0, 7); ctx.fill();
    ctx.fillStyle = '#22283a';
    ctx.beginPath(); ctx.arc(15.8, -11.5, state === 'dead' ? 3.6 : 2.2, 0, 7); ctx.fill();
    if (state === 'dead') {
      ctx.strokeStyle = '#22283a'; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(12.5, -13.5); ctx.lineTo(19, -9.5); ctx.moveTo(12.5, -9.5); ctx.lineTo(19, -13.5); ctx.stroke();
    }
    ctx.restore();
  }
  function drawParts() {
    for (var i = 0; i < parts.length; i++) {
      var q = parts[i], a = 1 - q.t / q.life;
      ctx.save(); ctx.globalAlpha = Math.max(0, a); ctx.fillStyle = q.c;
      if (q.feather) { ctx.translate(q.x, q.y); ctx.rotate(q.t * 6); ctx.fillRect(-q.r, -q.r * 0.4, q.r * 2.4, q.r * 0.9); }
      else { ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, 7); ctx.fill(); }
      ctx.restore();
    }
  }
  function drawHUD() {
    ctx.save();
    ctx.textBaseline = 'top';
    // score plate
    ctx.fillStyle = 'rgba(255,255,255,.72)';
    roundRect(14, 14, 168, 46, 12); ctx.fill();
    ctx.fillStyle = '#2b4a63'; ctx.font = 'bold 22px Georgia, serif';
    ctx.fillText('SCORE ' + score(), 26, 22);
    ctx.font = '13px Georgia, serif'; ctx.fillStyle = '#6b5a3a';
    ctx.fillText('dist ' + Math.floor(dist / 10) + ' m   best ' + best, 26, 45);
    // berries
    ctx.fillStyle = '#e0a417'; ctx.beginPath(); ctx.arc(200, 32, 8, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff0cd'; ctx.beginPath(); ctx.arc(197, 29, 2.6, 0, 7); ctx.fill();
    ctx.fillStyle = '#2b4a63'; ctx.font = 'bold 20px Georgia, serif';
    ctx.fillText('x ' + berryCount, 214, 22);
    // chapter label
    ctx.textAlign = 'right'; ctx.font = 'italic 13px Georgia, serif'; ctx.fillStyle = 'rgba(43,74,99,.85)';
    ctx.fillText(chapter(), W - 16, 18);
    ctx.textAlign = 'left'; ctx.font = '11px Georgia, serif'; ctx.fillStyle = 'rgba(43,74,99,.7)';
    ctx.fillText('Sammy the Bird — adventures by V Moua', 14, H - 20);
    ctx.restore();
    if (hintT > 0 && state === 'play') {
      var a = clamp(hintT / 1.2, 0, 1);
      ctx.save(); ctx.globalAlpha = a;
      ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(255,255,255,.9)';
      roundRect(W / 2 - 152, H * 0.66, 304, 52, 14); ctx.fill();
      ctx.fillStyle = '#2b4a63'; ctx.font = 'bold 17px Georgia, serif';
      ctx.fillText('TAP / SPACE to flap', W / 2, H * 0.66 + 10);
      ctx.font = '12px Georgia, serif';
      ctx.fillText('grab golden berries, dodge branches & storm clouds', W / 2, H * 0.66 + 31);
      ctx.restore();
    }
  }
  function chapter() {
    var d = dist / 10;
    if (d < 120) return 'Ch. 1 — The First Wobble';
    if (d < 300) return 'Ch. 2 — Berry Meadow';
    if (d < 560) return 'Ch. 3 — The Thick Bramble';
    if (d < 900) return 'Ch. 4 — Thunderhead Alley';
    if (d < 1400) return 'Ch. 5 — Sammy Gets Serious';
    return 'Ch. 6 — Legendary Little Bird';
  }
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
  }

  function render() {
    ctx.save();
    if (shake > 0) ctx.translate(rnd(-1, 1) * shake * 9, rnd(-1, 1) * shake * 9);
    drawSky(); drawHills(); drawGround();
    for (var i = 0; i < obstacles.length; i++) drawBranch(obstacles[i]);
    for (i = 0; i < berries.length; i++) drawBery(berries[i]);
    for (i = 0; i < hazards.length; i++) drawHaz(hazards[i]);
    drawParts(); drawSammy();
    ctx.restore();
    drawHUD();
  }

  /* ---------- loop ---------- */
  var last = performance.now();
  function frame(now) {
    var dt = Math.min(1 / 30, (now - last) / 1000); last = now;
    update(dt); render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ---------- input ---------- */
  function act(ev) {
    if (ev && ev.cancelable) ev.preventDefault();
    if (state === 'dead') { if (over.hidden) restart(); return; }
    flap();
  }
  cvs.addEventListener('pointerdown', act);
  cvs.addEventListener('click', act);
  document.addEventListener('keydown', function (e) {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW' || e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      if (state === 'dead') { restart(); } else { flap(); }
    } else if (e.key === 'r' || e.key === 'R') { restart(); }
  });
  over.addEventListener('click', function () { restart(); });
  document.getElementById('again').addEventListener('click', function (e) { e.stopPropagation(); restart(); });
  window.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });

  function restart() { over.hidden = true; reset(); }

  window.addEventListener('message', function (e) {
    var d = e.data;
    if (d && d.type === 'game-maker:dismiss-overlay') {
      over.hidden = true;
      if (state === 'dead') reset();
    }
  });
})();
</script>
</body>
</html>

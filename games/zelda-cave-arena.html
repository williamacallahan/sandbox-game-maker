<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cave of Ruins — tiny Zelda arena</title>
<style>
html,body{height:100%;margin:0;overflow:hidden;background:#070a12;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{position:absolute;inset:0;display:block;cursor:crosshair}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:10;
background:radial-gradient(circle at 50% 45%,rgba(10,15,26,.45),rgba(5,8,15,.88));backdrop-filter:blur(2px)}
.ov.hidden{display:none}
.panel{width:min(88vw,430px);padding:26px 22px;text-align:center;border-radius:4px;
background:linear-gradient(180deg,#151f31,#0b111d);border:3px solid #caa53d;
box-shadow:0 0 34px rgba(255,190,60,.28),inset 0 0 22px rgba(0,0,0,.6);
display:flex;flex-direction:column;align-items:center;gap:10px;font-family:'Courier New',monospace;color:#cdd9ef}
h1{margin:0;font-size:clamp(30px,8vw,52px);letter-spacing:3px;color:#ffd75e;
text-shadow:0 0 18px rgba(255,190,60,.55),0 3px 0 #7a4d10,0 6px 0 rgba(0,0,0,.6)}
h1.red{color:#ff5d6e;text-shadow:0 0 18px rgba(255,80,110,.6),0 3px 0 #6b1020,0 6px 0 rgba(0,0,0,.6)}
.tag{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:4px;color:#7f92b5}
.ctrl{font-size:13px;line-height:1.5;color:#b9c4dc;letter-spacing:1px}
.hint{font-size:11px;color:#5d6c8c;letter-spacing:2px}
.stats{font-size:19px;line-height:1.6;letter-spacing:2px;color:#ffd75e;text-shadow:0 0 10px rgba(255,190,60,.5)}
button{font-family:'Courier New',monospace;font-weight:bold;font-size:19px;letter-spacing:3px;margin-top:14px;
padding:12px 30px;color:#241a05;cursor:pointer;border:2px solid #ffe9a0;border-radius:3px;
background:linear-gradient(180deg,#ffd75e,#d99b2b);
box-shadow:0 5px 0 #8a5f14,0 0 22px rgba(255,190,60,.4);transition:transform .08s,filter .08s}
button:hover{transform:translateY(-1px);filter:brightness(1.12)}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #8a5f14,0 0 14px rgba(255,190,60,.4)}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="ovstart" class="ov" data-game-overlay>
 <div class="panel">
  <h1>CAVE OF RUINS</h1>
  <p class="tag">a tiny zelda-like arena</p>
  <div class="ctrl">WASD / arrows — run<br>SPACE / J / click — sword slash<br>touch: left stick + sword button</div>
  <div class="ctrl" style="color:#ffd75e">slay the giant octorok, then descend deeper…</div>
  <button id="btnstart" autofocus>&#9876; BEGIN THE DIVE</button>
  <div class="hint">ENTER / CLICK / TAP TO START</div>
 </div>
</div>

<div id="ovover" class="ov hidden" data-game-overlay>
 <div class="panel">
  <h1 class="red">YOU DIED</h1>
  <div class="ctrl">the ruins claim another hero…</div>
  <div class="stats" id="ostats"></div>
  <button id="btnretry">&#8635; FIGHT AGAIN</button>
 </div>
</div>

<script>
'use strict';
const cvs=document.getElementById('game'),ctx=cvs.getContext('2d');
let VW=0,VH=0,vign=null;
function resize(){VW=innerWidth;VH=innerHeight;cvs.width=VW;cvs.height=VH;
vign=ctx.createRadialGradient(VW/2,VH/2,Math.min(VW,VH)*.42,VW/2,VH/2,Math.max(VW,VH)*.72);
vign.addColorStop(0,'rgba(0,0,0,0)');vign.addColorStop(1,'rgba(4,7,14,.6)');}
addEventListener('resize',resize);resize();

const TS=32,MW=40,MH=40,W=MW*TS,H=MH*TS,TAU=Math.PI*2;
let map=new Uint8Array(MW*MW),torch=[];
const pad=n=>String(Math.floor(n)).padStart(6,'0');
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=s=>{seed=s;return()=>{seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};};
function tileAt(px,py){const tx=(px/TS)|0,ty=(py/TS)|0;if(tx<0||ty<0||tx>=MW||ty>=MH)return 2;return map[ty*MW+tx];}
function circRect(cx,cy,r,rx,ry,rw,rh){const nx=Math.max(rx,Math.min(cx,rx+rw)),ny=Math.max(ry,Math.min(cy,ry+rh));const dx=cx-nx,dy=cy-ny;return dx*dx+dy*dy<r*r;}
function solid(px,py,r){const x0=Math.floor((px-r)/TS),x1=Math.floor((px+r)/TS),y0=Math.floor((py-r)/TS),y1=Math.floor((py+r)/TS);
for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){if(tileAt(tx*TS,ty*TS)>=2&&circRect(px,py,r,tx*TS,ty*TS,TS,TS))return true;}return false;}
function freeSpot(){for(let i=0;i<20000;i++){const tx=2+(Math.random()*(MW-4)|0),ty=2+(Math.random()*(MH-4)|0);if(!map[ty*MW+tx])return{x:tx*TS+TS/2,y:ty*TS+TS/2};}return{x:W/2,y:H/2};}
function move(o,r,dx,dy){let hx=false,hy=false;const ox=o.x,oy=o.y;
if(dx){const s=Math.sign(dx);let nx=o.x+dx,st=0;while(st<16&&!solid(nx,o.y,r)){if(nx===o.x+dx)break;nx-=s*.5;st++;}o.x=nx;if(solid(o.x,o.y,r))o.x=ox;if(Math.abs(o.x-(o.x+dx))>0)hx=true;if(Math.abs(nx-(o.x+dx))>0)hx=true;}
if(dy){const s=Math.sign(dy);let ny=o.y+dy,st=0;while(st<16&&!solid(o.x,ny,r)){if(ny===o.y+oy)break;ny-=s*.5;st++;}o.y=ny;if(solid(o.x,o.y,r))o.y=oy;if(Math.abs(ny-(o.y+dy))>0)hy=true;}
return{x:hx,y:hy};}

/* ---------------- audio ---------------- */
let AC=null;
function audio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();}
function tone(f0,f1,dur,type,vol,delay){if(!AC)return;const t=AC.currentTime+(delay||0);const o=AC.createOscillator(),g=AC.createGain();o.type=type;
o.frequency.setValueAtTime(Math.max(1,f0),t);o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0008,t+dur);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.03);}
let nbuf=null;
function noiseS(dur,vol,freq){if(!AC)return;if(!nbuf){nbuf=AC.createBuffer(1,(AC.sampleRate*.5)|0,AC.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
const t=AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=nbuf;f.type='lowpass';f.frequency.value=freq;
g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0008,t+dur);s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t);s.stop(t+dur+.05);}
const SND={
slash(){tone(340,90,.09,'square',.14);},
hit(){tone(200,55,.11,'square',.18);},
pick(){tone(660,660,.06,'square',.13);tone(990,990,.1,'square',.13,.06);},
heart(){tone(520,780,.09,'triangle',.2);tone(780,1175,.14,'triangle',.2,.09);},
hurt(){tone(230,45,.28,'sawtooth',.24);noiseS(.18,.18,900);},
boom(){noiseS(.38,.4,520);tone(130,28,.32,'triangle',.28);},
shoot(){tone(520,260,.08,'triangle',.09);},
roar(){tone(75,26,.8,'sawtooth',.3);noiseS(.5,.22,300);},
clear(){[330,415,494,660,830].forEach((f,i)=>tone(f,f,.12,'square',.14,i*.09));},
splash(){tone(170,60,.18,'sawtooth',.13);}
};

/* ---------------- world ---------------- */
function genWorld(){
map.fill(0);
for(let y=0;y<MH;y++)for(let x=0;x<MW;x++)if(x<2||y<2||x>=MW-2||y>=MH-2)map[y*MW+x]=2;
let s=(Math.random()*1e9)|0;const R=rnd(s);const rects=[];
const blocked=a=>rects.some(w=>a.x<w.x+w.w&&a.x+a.w>w.x&&a.y<w.y+w.h&&a.y+a.h>w.y);
const center=a=>a.x+2<W/2&&a.x+a.w+2>W/2&&a.y+2<H/2&&a.y+a.h+2>H/2;
for(let i=0;i<44;i++){const w=2+(R()*3|0),h=2+(R()*3|0),x=3+(R()*(MW-6-w)|0),y=3+(R()*(MH-6-h)|0);
const r={x,y,w,h};if(center(r)||blocked(r))continue;rects.push(r);
for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++)map[yy*MW+xx]=3;}
const pits=[];
const hitwall=(x,y,w,h)=>{for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++)if(map[yy*MW+xx]===3)return true;return false;};
for(let i=0;i<26;i++){const w=2+(R()*3|0),h=2+(R()*3|0),x=3+(R()*(MW-6-w)|0),y=3+(R()*(MH-6-h)|0);
if(center({x,y,w,h})||hitwall(x,y,w,h))continue;
if(pits.some(p=>x<p.x+p.w&&x+w>p.x&&y<p.y+p.h&&y+h>p.y))continue;
pits.push({x,y,w,h});for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++)map[yy*MW+xx]=4;}
torch=[];
let tries=0;while(torch.length<10&&tries<800){tries++;
const x=2+(R()*(MW-4)|0),y=2+(R()*(MH-4)|0);if(map[y*MW+x]!==3)continue;
const open=(map[y*MW+x+1]===0)||(map[y*MW+x-1]===0)||(map[(y+1)*MW+x]===0)||(map[(y-1)*MW+x]===0);
if(open&&!torch.some(t=>t.x===x&&t.y===y))torch.push({x,y});}
}

/* ---------------- state ---------------- */
const player={x:W/2,y:H/2,r:11,hp:8,maxhp:8,dir:0,face:0,slash:{t:0,a:0,cd:0,hits:null},inv:0,kvx:0,kvy:0};
let enemies=[],bullets=[],parts=[],pickups=[],boss=null;
let state='title',time=0,score=0,floor=1,shake=0,flash=0,banner=null,bossCd=0,pendFloor=0;

function say(txt,dur){banner={txt,t:dur,max:dur};}
function spawnEnemy(type){
let px=null,py=0;
for(let i=0;i<400&&!px;i++){const tx=3+(Math.random()*(MW-6)|0),ty=3+(Math.random()*(MH-6)|0);
if(map[ty*MW+tx]!==0)continue;const x=tx*TS+TS/2,y=ty*TS+TS/2;
if(dist(x,y,player.x,player.y)<240)continue;if(enemies.some(e=>dist(x,y,e.x,e.y)<70))continue;px=x;py=y;}
if(px===null)return;
if(type==='moblin')enemies.push({type,x:px,y:py,r:12,hp:2+floor,maxhp:2+floor,st:'w',t:0,d:0,kvx:0,kvy:0,flash:0,cool:1,face:0,score:10});
else enemies.push({type,x:px,y:py,r:13,hp:3+floor,maxhp:3+floor,st:'w',t:0,d:0,kvx:0,kvy:0,flash:0,cool:1,face:0,score:15});
}
function resetFloor(n,keep){
floor=n;genWorld();
enemies=[];bullets=[];pickups=[];boss=null;bossCd=0;pendFloor=0;
if(!keep){player.x=W/2;player.y=H/2;player.hp=player.maxhp;player.kvx=player.kvy=0;player.inv=.6;}
else if(map[(player.y/TS|0)*MW+(player.x/TS|0)]!==0){const s=freeSpot();player.x=s.x;player.y=s.y;}
const mobs=Math.min(3+floor,9),ocs=Math.min(1+((floor-1)>>1),5);
for(let i=0;i<mobs;i++)spawnEnemy('moblin');
for(let i=0;i<ocs;i++)spawnEnemy('ocro');
say('DEPTH '+floor,1.5);
}

/* ---------------- fx ---------------- */
function burst(n,x,y,col,spd){for(let i=0;i<n;i++){const a=Math.random()*TAU,s=spd*(.4+Math.random()*.9);
parts.push({tp:'spk',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.45,max:.45,c:col,sz:2+Math.random()*3});}}
function flames(n,x,y){const cs=['#ffd75e','#ff9a3e','#e0442e'];for(let i=0;i<n;i++){const a=Math.random()*TAU,s=30+Math.random()*90;
parts.push({tp:'fl',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.5,max:.5,c:cs[i%3],sz:5+Math.random()*7});}}
function ringp(x,y,c,mr){parts.push({tp:'rg',x,y,vx:0,vy:0,life:.4,max:.4,c,mr:mr||70});}
function textp(x,y,txt){parts.push({tp:'tx',x,y,vx:0,vy:-42,life:.9,max:.9,c:'#ffd75e',txt});}
function explode(x,y,sc){
for(let i=0;i<26*sc;i++){const a=Math.random()*TAU,sp=60+Math.random()*260;
parts.push({tp:'spk',x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:.6,max:.6,c:['#ffd75e','#ff9a3e','#ff5533','#fff'][i%4],sz:2+Math.random()*4});}
ringp(x,y,'#ffd75e',40*sc);flames(8,x,y);
}

/* ---------------- combat ---------------- */
function gameOver(){
state='over';
document.getElementById('ostats').innerHTML='SCORE '+pad(score)+'<br>DEEPEST FLOOR '+floor;
show('ovover');setTimeout(()=>document.getElementById('btnretry').focus({preventScroll:true}),60);
}
function hurtPlayer(kx,ky){
if(player.inv>0||state!=='play')return;
player.hp--;player.inv=1.1;flash=.35;shake=Math.max(shake,8);
player.kvx=kx*230;player.kvy=ky*230;
burst(14,player.x,player.y,'#ff5566',180);ringp(player.x,player.y,'#ff5566',40);SND.hurt();
if(player.hp<=0){player.hp=0;explode(player.x,player.y,1.4);burst(30,player.x,player.y,'#7ec8ff',240);shake=18;gameOver();}
}
function hurt(e,dmg,kx,ky){
e.hp-=dmg;e.flash=.1;burst(6,e.x,e.y,'#ffd75e',140);shake=Math.max(shake,2);
e.kvx+=kx*150;e.kvy+=ky*150;
const nm=e.type==='boss'?80:1;
for(let i=0;i<nm;i++)tone(240-i*9,60,.1,'square',.12,i*.03);
if(e.hp<=0)kill(e);
}
function kill(e){
const x=e.x,y=e.y;
explode(x,y,e.type==='boss'?1.8:.9);ringp(x,y,'#ff9a3e',e.type==='boss'?130:60);
noiseS(.3,.3,600);shake=Math.max(shake,e.type==='boss'?16:5);
score+=e.score;textp(x,y,'+'+e.score);
if(e.type==='boss'){
boss=null;pickups.push({tp:'h',x,y});
for(let i=0;i<3;i++){const a=i/3*TAU;pickups.push({tp:'r',x:x+Math.cos(a)*42,y:y+Math.sin(a)*42});}
say('DEPTH CLEARED',1.6);SND.clear();pendFloor=1.8;
}else{
if(Math.random()<.5)pickups.push({tp:'r',x,y});
if(Math.random()<.14)pickups.push({tp:'h',x:x+14,y:y+8});
}
}
function spawnBoss(){
const x=W/2,y=H/2;
boss={type:'boss',x,y,r:30,hp:16+floor*4,maxhp:16+floor*4,st:'spiral',t:1.3,cool:1.4,dash:0,da:0,dvx:0,dvy:0,flash:0,flash2:0,ang:0,cool2:2};
explode(x,y,1.2);say('THE GIANT OCTOROK',1.8);tone(75,26,.8,'sawtooth',.3);shake=10;
}

/* ---------------- input ---------------- */
const keys={};
let joy={on:false,id:-1,ox:0,oy:0,dx:0,dy:0},atkId=-1,atkTouch=false;
const isTouch=('ontouchstart'in window);
const mouse={x:0,y:0,atk:false,cam:0};
let clickAtk=false;
addEventListener('keydown',e=>{
if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
keys[e.code]=true;audio();
if(e.code==='KeyR'&&state==='over')restart();
if((e.code==='Enter'||e.code==='Space')){if(state==='title')begin();else if(state==='over')restart();}
});
addEventListener('keyup',e=>keys[e.code]=false);
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
addEventListener('pointerdown',()=>audio());
cvs.addEventListener('click',()=>{audio();if(state==='play')mouse.atk=true;});
addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;});
addEventListener('touchstart',e=>{e.preventDefault();audio();if(state!=='play')return;
for(const t of e.changedTouches){
if(t.clientX<VW*.5&&!joy.on){joy.on=true;joy.id=t.identifier;joy.ox=t.clientX;joy.oy=t.clientY;joy.dx=0;joy.dy=0;}
else if(atkId<0){atkId=t.identifier;atkTouch=true;}
}},{passive:false});
addEventListener('touchmove',e=>{e.preventDefault();
for(const t of e.changedTouches){if(t.identifier===joy.id){
const dx=t.clientX-joy.ox,dy=t.clientY-joy.oy,l=Math.hypot(dx,dy)||1;
joy.dx=(dx/l)*Math.min(l,40);joy.dy=(dy/l)*Math.min(l,40);}}},{passive:false});
addEventListener('touchend',e=>{
for(const t of e.changedTouches){if(t.identifier===joy.id){joy.on=false;joy.dx=joy.dy=0;}if(t.identifier===atkId){atkId=-1;atkTouch=false;}}});
const ovS=document.getElementById('ovstart'),ovO=document.getElementById('ovover');
function show(id){ovS.classList.toggle('hidden',id!=='ovstart');ovO.classList.toggle('hidden',id!=='ovover');}
function ovClick(){audio();if(state==='title')begin();else if(state==='over')restart();}
ovS.addEventListener('click',ovClick);ovS.addEventListener('pointerdown',ovClick);
ovO.addEventListener('click',ovClick);ovO.addEventListener('pointerdown',ovClick);
document.getElementById('btnstart').addEventListener('click',begin);
document.getElementById('btnretry').addEventListener('click',restart);
addEventListener('message',e=>{if(e.data&&e.data.type==='game-maker:dismiss-overlay'){
document.querySelectorAll('[data-game-overlay]').forEach(o=>o.classList.add('hidden'));
if(state==='title')begin();else if(state==='over')restart();}});

function begin(){if(state!=='title')return;audio();[330,415,494,660].forEach((f,i)=>tone(f,f,.1,'square',.12,i*.07));show(null);state='play';
document.getElementById('btnstart').blur();}
function restart(){if(state!=='over')return;audio();score=0;resetFloor(1,false);show(null);state='play';
document.getElementById('btnretry').blur();}

/* ---------------- updates ---------------- */
function updPlayer(dt){
let mx=((keys.ArrowRight||keys.KeyD)?1:0)-((keys.ArrowLeft||keys.KeyA)?1:0);
let my=((keys.ArrowDown||keys.KeyS)?1:0)-((keys.ArrowUp||keys.KeyW)?1:0);
if(joy.on){mx+=clamp(joy.dx/40,-1,1);my+=clamp(joy.dy/40,-1,1);}
const ml=Math.hypot(mx,my);if(ml>1){mx/=ml;my/=ml;}
const spd=Math.min(205,160+floor*3);
player.kvx*=Math.max(0,1-7*dt);player.kvy*=Math.max(0,1-7*dt);
move(player,player.r,mx*spd*dt+player.kvx*dt,0);
move(player,player.r,0,my*spd*dt+player.kvy*dt);
player.x=clamp(player.x,player.r+TS,TS*MW-player.r-TS);
player.y=clamp(player.y,player.r+TS,TS*MH-player.r-TS);
let facing=Math.atan2(mouse.y-mouse.cam,player.x-player.vx);
if(ml>0.1)player.dir=Math.atan2(my,mx);
if(clickAtk&&state==='play'){player.dir=Math.atan2(mouse.y-mouse.cam,mouse.x-player.x);clickAtk=false;}
const slash=player.slash;slash.cd-=dt;slash.t-=dt;
const atk=(keys.Space||keys.KeyJ||atkTouch||mouse.atk);
if(atk&&slash.cd<=0){slash.t=.15;slash.a=player.dir;slash.cd=.34;slash.hits=new Set();tone(340,90,.09,'square',.14);}
if(slash.t>0){
const p=1-slash.t/.15,sw=2.3,aa=slash.a-sw/2+p*sw;player.face=aa;
const hx=player.x+Math.cos(aa)*20,hy=player.y+Math.sin(aa)*20;
if(Math.random()<.9)parts.push({tp:'fl',x:hx,y:hy,vx:0,vy:0,life:.18,max:.18,c:'#bfffd4',sz:4});
for(const e of enemies){if(slash.hits.has(e))continue;
if(dist(e.x,e.y,hx,hy)<e.r+13){slash.hits.add(e);
const a=Math.atan2(e.y-player.y,e.x-player.x);hurt(e,1,a,a);}}
if(boss&&!slash.hits.has(boss)&&dist(boss.x,boss.y,hx,hy)<boss.r+13){slash.hits.add(boss);
const a=Math.atan2(boss.y-player.y,boss.x-player.x);hurt(boss,1,a,a);}
}else player.face=Math.atan2(mouse.y-mouse.cam,mouse.x-player.x);
if(ml>0.1)player.face=Math.atan2(my,mx);
if(Math.hypot(player.vx,player.vy)>.1)player.face=Math.atan2(my,mx);
if(tileAt(player.x,player.y)===4){
let dx=player.kvx,dy=player.kvy;if(!dx&&!dy)dy=-1;
const l=Math.hypot(dx,dy)||1;
hurtPlayer(-dx/l,-dy/l);tone(170,60,.18,'sawtooth',.13);
}
mouse.atk=false;
}
function updEnemies(dt){
const pc=state==='play';
for(let i=enemies.length-1;i>=0;i--){

function heartPath(x,y,s){
ctx.beginPath();ctx.moveTo(x,y+s*.5);
ctx.bezierCurveTo(x,y-s*.2,x-s,y-s*.1,x-s,y+s*.4);
ctx.bezierCurveTo(x-s,y+s,x-s*.5,y+s*1.2,x,y+s*1.4);
ctx.bezierCurveTo(x+s*.5,y+s*1.2,x+s,y+s,x+s,y+s*.4);
ctx.bezierCurveTo(x+s,y-s*.1,x,y-s*.2,x,y+s*.5);
ctx.closePath();
}
function heart(x,y,s,fill,stroke){heartPath(x,y,s);
if(fill){ctx.fillStyle=fill;ctx.fill();}
if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1.5;ctx.stroke();}}
function rupee(x,y,s,col,stroke){
ctx.beginPath();ctx.moveTo(x,y-s);ctx.lineTo(x+s,y-s*.2);ctx.lineTo(x+s*.6,y+s);ctx.lineTo(x-s*.6,y+s);ctx.lineTo(x-s,y-s*.2);ctx.closePath();
ctx.fillStyle=col;ctx.fill();ctx.strokeStyle=stroke;ctx.lineWidth=1.5;ctx.stroke();
ctx.beginPath();ctx.moveTo(x,y-s*.5);ctx.lineTo(x+s*.4,y-s*.1);ctx.lineTo(x,y+s*.6);ctx.lineTo(x-s*.4,y-s*.1);ctx.closePath();
ctx.fillStyle='rgba(255,255,255,.35)';ctx.fill();
}

const px1=sx0+Math.cos(gx+2)*rr,py1=sy0+Math.sin(gx+2)*rr;
const px2=sx0+Math.cos(gx-2)*rr,py2=sy0+Math.sin(gx-2)*rr;
ctx.beginPath();ctx.arc(px1,py1,e.r*.2,0,TAU);ctx.fillStyle='#fff';ctx.fill();
ctx.beginPath();ctx.arc(px1,py1,e.r*.1,0,TAU);ctx.fillStyle='#111';ctx.fill();
ctx.beginPath();ctx.arc(px2,py2,e.r*.2,0,TAU);ctx.fillStyle='#fff';ctx.fill();
ctx.beginPath();ctx.arc(px2,py2,e.r*.1,0,TAU);ctx.fillStyle='#111';ctx.fill();
}
function render(){
ctx.fillStyle='#070a12';ctx.fillRect(0,0,VW,VH);
const sh=shake,ox=Math.random()*2*sh,oy=Math.random()*2*sh;
const camX=clamp(player.x-VW/2,0,W-VW)+ox,camY=clamp(player.y-VH/2,0,H-VH)+oy;
mouse.cam=camY;
const tx0=Math.max(0,(camX/TS)|0),tx1=Math.min(MW-1,((camX+VW)/TS)|0);
const ty0=Math.max(0,(camY/TS)|0),ty1=Math.min(MH-1,((camY+VH)/TS)|0);
for(let ty=ty0;ty<=ty1;ty++)for(let tx=tx0;tx<=tx1;tx++)drawTile(tx,ty,tx*TS-camX,ty*TS-camY);
const ts=TS;
const tsx0=Math.max(0,(camX/TS)|0),tsx1=Math.min(MW-1,((camX+VW)/TS)|0);
const tsy0=Math.max(0,(camY/TS)|0),tsy1=Math.min(MH-1,((camY+VH)/TS)|0);
ctx.fillStyle='rgba(0,0,0,.15)';
for(let ty=tsy0;ty<=tsy1;ty++)for(let tx=tsx0;tx<=tsx1;tx++){const t=map[ty*MW+tx];
if(t>=3){if(ty+1<MH&&map[(ty+1)*MW+tx]===0)ctx.fillRect(tx*TS-camX,ty*TS-camY,TS,TS);}}
for(const p of pickups){
const bob=Math.sin(time*4+p.x*.07)*3;
if(p.tp==='r')rupee(p.x-camX,p.y-camY+bob,8,'#5fd37f','#2e8f4a');
else heart(p.x-camX,p.y-camY+bob,9,'#ff5f6f','#7a1220');
}
for(const e of enemies)draw(e,camX,camY);
if(boss){const flash=boss.flash>0,flash2=boss.flash2>0;
const sx=boss.x-camX,sy=boss.y-camY;const pulse=(Math.sin(time*3)+1)/2;
const body=flash?'#fff':flash2?'#ffe9a0':'#4e8fd0';
ctx.beginPath();ctx.arc(sx,sy,boss.r,0,TAU);ctx.fillStyle=body;ctx.fill();
ctx.lineWidth=3;ctx.strokeStyle='#1d3e6e';ctx.stroke();
const arms=[boss.ang,boss.ang+TAU/4,boss.ang+TAU/2,boss.ang+TAU*3/4];
for(const aa of arms){const ar=boss.r*(.5+.15*Math.sin(time*6));
ctx.beginPath();ctx.arc(sx+Math.cos(aa)*ar,sy+Math.sin(aa)*ar,boss.r*.28,0,TAU);
ctx.fillStyle='#3e7ec4';ctx.fill();ctx.lineWidth=1.5;ctx.strokeStyle='#1d3e6e';ctx.stroke();}
const rr=boss.r*.55;
ctx.beginPath();ctx.arc(sx,sy,rr,0,TAU);ctx.fillStyle='rgba(120,200,255,'+(0.3+pulse*.4)+')';ctx.fill();
const gx=boss.face,sx0=sx-Math.sin(gx)*4,sy0=sy+Math.cos(gx)*4;
const px1=sx0+Math.cos(gx+2)*rr,py1=sy0+Math.sin(gx+2)*rr;
const px2=sx0+Math.cos(gx-2)*rr,py2=sy0+Math.sin(gx-2)*rr;
ctx.beginPath();ctx.arc(px1,py1,boss.r*.2,0,TAU);ctx.fillStyle='#fff';ctx.fill();
ctx.beginPath();ctx.arc(px1,py1,boss.r*.1,0,TAU);ctx.fillStyle='#111';ctx.fill();
ctx.beginPath();ctx.arc(px2,py2,boss.r*.2,0,TAU);ctx.fillStyle='#fff';ctx.fill();
ctx.beginPath();ctx.arc(px2,py2,boss.r*.1,0,TAU);ctx.fillStyle='#111';ctx.fill();
}
const inv=player.inv>0&&Math.sin(time*40)>0;
const sx=player.x-camX,sy=player.y-camY;
ctx.beginPath();ctx.arc(sx,sy,player.r,0,TAU);ctx.fillStyle='#3d8f4e';ctx.fill();
ctx.lineWidth=2;ctx.strokeStyle='#1f5c2e';ctx.stroke();
const hx=sx,hy=sy-4;
ctx.beginPath();ctx.arc(hx,hy,player.r*.55,0,TAU);ctx.fillStyle='#e8c37e';ctx.fill();
const gx=player.face,oy1=Math.cos(gx+2.2)*3.5,oy2=Math.cos(gx-2.2)*3.5;
const ox1=Math.sin(gx+2.2)*3,ox2=Math.sin(gx-2.2)*3;
const px1=sx-Math.sin(gx)*3+ox1,py1=sy-4+oy1;
const px2=sx-Math.sin(gx)*3+ox2,py2=sy-4+oy2;
ctx.beginPath();ctx.arc(px1,py1,1.5,0,TAU);ctx.fillStyle='#1a3a5c';ctx.fill();
ctx.beginPath();ctx.arc(px2,py2,1.5,0,TAU);ctx.fillStyle='#1a3a5c';ctx.fill();
if(player.slash.t>0){
const p=1-player.slash.t/.15,sw=2.3,a=player.slash.a-sw/2+p*sw;
const hx2=sx+Math.cos(a)*2,hy2=sy+Math.sin(a)*2;
ctx.save();ctx.translate(hx2,hy2);ctx.rotate(a);
ctx.shadowColor='rgba(190,255,220,.8)';ctx.shadowBlur=10;
ctx.beginPath();ctx.moveTo(0,-4);ctx.lineTo(3,0);ctx.lineTo(0,4);ctx.lineTo(-14,3);ctx.lineTo(-18,0);ctx.lineTo(-14,-3);ctx.closePath();
ctx.fillStyle='#e8f4ff';ctx.fill();ctx.shadowBlur=0;ctx.restore();
const sxh=sx+Math.cos(a)*20,syh=sy+Math.sin(a)*20;
ctx.fillStyle='#cfe8ff';ctx.fillRect(sxh-3,syh-3,6,6);
}
const parts=pickups.length?pickups:pickups; // parts drawn separately
for(const p of parts){
const px=p.x-camX,py=p.y-camY,al=p.life/p.max;
if(p.tp==='spk'){ctx.globalAlpha=al;ctx.fillStyle=p.c;ctx.fillRect(px-p.sz/2,py-p.sz/2,p.sz,p.sz);ctx.globalAlpha=1;}
else if(p.tp==='fl'){ctx.globalAlpha=al;ctx.beginPath();ctx.arc(px,py,p.sz*(0.4+0.6*al),0,TAU);ctx.fillStyle=p.c;ctx.fill();ctx.globalAlpha=1;}
else if(p.tp==='rg'){const rr=(1-al)*p.mr;ctx.globalAlpha=al;ctx.beginPath();ctx.arc(px,py,rr,0,TAU);ctx.strokeStyle=p.c;ctx.lineWidth=3;ctx.stroke();ctx.globalAlpha=1;}
else if(p.tp==='tx'){ctx.globalAlpha=al;ctx.font='bold 15px Courier New,monospace';ctx.textAlign='center';ctx.fillStyle=p.c;ctx.fillText(p.txt,px,py);ctx.globalAlpha=1;}
}
const torches=torch;
for(const t of torches){const x=t.x*TS+TS/2-camX,y=t.y*TS+TS/2-camY;
if(x<-20||x>VW+20||y<-20||y>VH+20)continue;
const g=ctx.createRadialGradient(x,y,2,x,y,54);
const fl=.8+.2*Math.sin(time*13+t.x*2+t.y);
g.addColorStop(0,'rgba(255,160,60,'+(0.32*fl)+')');g.addColorStop(1,'rgba(255,120,30,0)');
ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,54,0,TAU);ctx.fill();
const h=time*9+t.x;
ctx.beginPath();ctx.arc(x,y,6,0,TAU);ctx.fillStyle='rgba(255,110,30,.9)';ctx.fill();
ctx.beginPath();ctx.arc(x,y,3.5,0,TAU);ctx.fillStyle='rgba(255,200,90,.95)';ctx.fill();
ctx.fillStyle='rgba(255,240,180,.9)';ctx.fillRect(x-1,y-2,2,4);
}
ctx.fillStyle=vign;ctx.fillRect(0,0,VW,VH);
if(flash>0){ctx.globalAlpha=flash;ctx.fillStyle='#c0303a';ctx.fillRect(0,0,VW,VH);ctx.globalAlpha=1;}
const hud={font:'bold 18px Courier New,monospace'};
let x=14,y=20;
for(let i=0;i<player.maxhp;i++){heart(20+i*24,y,10,i<player.hp?'#ff4d5f':'#33151e',i<player.hp?'#8f1b2e':'#4a2030');}
const fs='bold '+clamp(Math.min(20,VW*.035),14,24)+'px Courier New,monospace';
ctx.font=fs;ctx.textAlign='right';ctx.fillStyle='#ffd75e';ctx.shadowColor='rgba(0,0,0,.8)';ctx.shadowBlur=4;
rupee(VW-96,y,8,'#5fd37f','#2e8f4a');
ctx.fillText(pad(score),VW-14,y+7);
ctx.shadowBlur=0;ctx.textAlign='center';ctx.font='bold '+clamp(15,VW*.025,20)+'px Courier New,monospace';
ctx.fillStyle='#7f92b5';ctx.fillText('DEPTH '+floor,VW/2,26);
const bw=Math.min(VW*.55,460),bh=13,bx=(VW-bw)/2,by=10;
ctx.fillStyle='rgba(10,14,24,.8)';ctx.fillRect(bx,by,bw,bh);
const ph=boss.hp/boss.maxhp;ctx.fillStyle='#ff8b3e';ctx.fillRect(bx,by,bw*ph,bh);
ctx.lineWidth=2;ctx.strokeStyle='#caa53d';ctx.strokeRect(bx,by,bw,bh);
const bl=Math.sin(time*10)>0;
ctx.font='bold 11px Courier New,monospace';ctx.fillStyle=bl?'#fff':'#ffb347';ctx.fillText('GIANT OCTOROK',VW/2,by+bh/2+4);
if(banner){const al=Math.min(1,banner.t/.3,(banner.max-banner.t)/.3);
const fs2='bold '+clamp(34,VW*.05,52)+'px Courier New,monospace';
ctx.globalAlpha=clamp(al,0,1);ctx.font=fs2;ctx.textAlign='center';
ctx.lineWidth=5;ctx.strokeStyle='rgba(10,8,2,.9)';ctx.strokeText(banner.txt,VW/2,VH*.3);
ctx.fillStyle='#ffd75e';ctx.fillText(banner.txt,VW/2,VH*.3);ctx.globalAlpha=1;}
const touch=isTouch&&!ov.classList.contains('hidden')&&!ovO.classList.contains('hidden');
const joy=isTouch&&state==='play';
const joy={on:false}; // joy placeholder already global
ctx.globalAlpha=.2;ctx.strokeStyle='#cdd9ef';ctx.lineWidth=2;ctx.beginPath();ctx.arc(joy.ox,joy.oy,44,0,TAU);ctx.stroke();
ctx.globalAlpha=.4;ctx.beginPath();ctx.arc(joy.ox+joy.dx,joy.oy+joy.dy,18,0,TAU);ctx.stroke();ctx.globalAlpha=1;
const atk=isTouch&&state==='play';
const ax=VW-70,ay=VH-90;
ctx.globalAlpha=.22;ctx.beginPath();ctx.arc(ax,ay,40,0,TAU);ctx.fillStyle='#ffd75e';ctx.fill();ctx.globalAlpha=.9;ctx.font='26px serif';ctx.textAlign='center';ctx.fillText('\u2694',ax,ay+9);ctx.globalAlpha=1;
}
const ov=document.getElementById('ovstart'); // reference
let last=0;
function frame(t){
const dt=Math.min(.033,(t-last)/1000||.016);last=t;
if(state==='play'){
tick(dt);
}else if(state==='title'){
tick(dt);
}else{
tick(dt);
}
render();
requestAnimationFrame(frame);
}
resetFloor(1,false);
requestAnimationFrame(frame);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Crash Derby</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%; background: #111; }
  #game { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #overlay {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(10, 10, 16, 0.78); z-index: 10; cursor: pointer;
    font-family: "Arial Black", Arial, sans-serif; user-select: none;
  }
  #overlay.hidden { display: none; }
  #panel {
    text-align: center; color: #fff; padding: 28px 44px;
    border: 3px solid #ffb020; border-radius: 18px; background: rgba(20, 20, 30, 0.9);
    box-shadow: 0 0 40px rgba(255, 176, 32, 0.35);
  }
  #title { font-size: 44px; letter-spacing: 2px; color: #ffb020; margin: 0 0 10px 0; text-shadow: 3px 3px 0 #7a2c00; }
  #sub { font-size: 16px; color: #cfd6e4; margin: 6px 0; font-family: Arial, sans-serif; font-weight: bold; }
  #hint { font-size: 14px; color: #8f99ad; margin-top: 14px; font-family: Arial, sans-serif; animation: blink 1.2s infinite; }
  @keyframes blink { 50% { opacity: 0.35; } }
  #pauseBtn {
    position: fixed; top: 12px; right: 12px; z-index: 5;
    padding: 10px 16px; font-family: "Arial Black", Arial, sans-serif; font-size: 15px;
    background: rgba(255,176,32,0.9); color: #221500; border: none; border-radius: 10px;
    cursor: pointer; font-weight: 900;
  }
  #pauseBtn:hover { background: #ffcb5e; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<button id="pauseBtn">⏸ PAUSE</button>
<div id="overlay" data-game-overlay>
  <div id="panel">
    <h1 id="title">CRASH DERBY</h1>
    <p id="sub">Ram every rival car to bits. Don't get wrecked!</p>
    <p id="sub" style="font-size:13px;color:#9aa3b5;">WASD / Arrows drive &nbsp;•&nbsp; SPACE = Nitro &nbsp;•&nbsp; P / ESC = Pause</p>
    <p id="hint">CLICK / TAP or PRESS ANY KEY TO START</p>
  </div>
</div>
<script>
"use strict";
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const overlay = document.getElementById("overlay");
const titleEl = document.getElementById("title");
const subEl = document.getElementById("sub");
const hintEl = document.getElementById("hint");
const pauseBtn = document.getElementById("pauseBtn");

let W = 0, H = 0;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

// ---------- Audio ----------
let actx = null;
function ensureAudio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (actx && actx.state === "suspended") actx.resume();
}
function thump(freq, dur, vol) {
  if (!actx) return;
  const t = actx.currentTime;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = "sawtooth";
  o.frequency.setValueAtTime(freq, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * 0.4), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(actx.destination);
  o.start(t); o.stop(t + dur);
}

// ---------- Game state ----------
const STATE = { START: 0, PLAY: 1, PAUSE: 2, OVER: 3 };
let state = STATE.START;
let cars = [], particles = [], scorches = [], floaters = [];
let wave = 1, wrecks = 0, score = 0, elapsed = 0;
let shakeT = 0, shakeMag = 0;
const keys = {};

const COLORS = ["#e8483a", "#3aa0e8", "#48c96a", "#e8c93a", "#b44be0", "#ff8c2e", "#2ee8c9"];

function makeCar(x, y, angle, color, isPlayer) {
  return {
    x, y, angle, vx: 0, vy: 0, color, isPlayer,
    r: 20, health: 100, maxHealth: 100, wrecked: false, wreckT: 0,
    boost: 100, smokeT: 0, wander: Math.random() * Math.PI * 2, wanderT: 0, hitFlash: 0
  };
}

function spawnWave() {
  const pad = 70;
  for (let i = 0; i < Math.min(2 + wave, 7); i++) {
    let x, y, tries = 0;
    do {
      x = pad + Math.random() * (W - pad * 2);
      y = pad + Math.random() * (H - pad * 2);
      tries++;
    } while (cars.some(c => Math.hypot(c.x - x, c.y - y) < 160) && tries < 40);
    cars.push(makeCar(x, y, Math.random() * Math.PI * 2, COLORS[(i + 1) % COLORS.length], false));
  }
}

function resetGame() {
  cars = []; particles = []; scorches = []; floaters = [];
  wave = 1; wrecks = 0; score = 0; elapsed = 0; shakeT = 0;
  cars.push(makeCar(W / 2, H / 2, -Math.PI / 2, "#f5f5f5", true));
  spawnWave();
}

// ---------- Input ----------
window.addEventListener("keydown", e => {
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(e.key)) e.preventDefault();
  keys[e.key.toLowerCase()] = true;
  ensureAudio();
  if (state === STATE.START) { startGame(); return; }
  if (state === STATE.OVER) { if (e.key.toLowerCase() === "r" || e.key === "Enter" || e.key === " ") restart(); return; }
  if (e.key.toLowerCase() === "p" || e.key === "Escape") togglePause();
});
window.addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });

overlay.addEventListener("click", () => {
  ensureAudio();
  if (state === STATE.START) startGame();
  else if (state === STATE.PAUSE) togglePause();
  else if (state === STATE.OVER) restart();
});
pauseBtn.addEventListener("click", () => {
  ensureAudio();
  if (state === STATE.PLAY || state === STATE.PAUSE) togglePause();
});
window.addEventListener("message", ev => {
  if (ev.data && ev.data.type === "game-maker:dismiss-overlay" && overlay && !overlay.classList.contains("hidden")) {
    if (state === STATE.START) startGame();
    else if (state === STATE.PAUSE) togglePause();
    else if (state === STATE.OVER) restart();
  }
});

function showOverlay(title, sub, hint) {
  titleEl.textContent = title;
  subEl.textContent = sub;
  hintEl.textContent = hint;
  overlay.classList.remove("hidden");
}
function hideOverlay() { overlay.classList.add("hidden"); }

function startGame() { resetGame(); state = STATE.PLAY; hideOverlay(); pauseBtn.textContent = "⏸ PAUSE"; }
function restart() { startGame(); }
function togglePause() {
  if (state === STATE.PLAY) {
    state = STATE.PAUSE;
    showOverlay("PAUSED", "Take a breath. The derby waits for no one... actually it does.", "PRESS P / ESC or CLICK TO RESUME");
    pauseBtn.textContent = "▶ RESUME";
  } else if (state === STATE.PAUSE) {
    state = STATE.PLAY;
    hideOverlay();
    pauseBtn.textContent = "⏸ PAUSE";
  }
}

function gameOver(won) {
  state = STATE.OVER;
  showOverlay(
    won ? "WAVE CLEARED!" : "WRECKED!",
    won ? "New wave incoming — more rivals, more chaos." : "Your ride is toast. Final score: " + score,
    won ? "CLICK / TAP or PRESS ANY KEY FOR NEXT WAVE" : "CLICK / TAP or PRESS R TO PLAY AGAIN"
  );
  pauseBtn.textContent = "⏸ PAUSE";
}

// ---------- Particles ----------
function spark(x, y, n, color, speed) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = (0.3 + Math.random()) * speed;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.3 + Math.random() * 0.5, maxLife: 0.8, size: 2 + Math.random() * 3, color: color || "#ffd24a", grav: 0 });
  }
}
function smoke(x, y) {
  particles.push({ x, y, vx: (Math.random() - 0.5) * 30, vy: (Math.random() - 0.5) * 30 - 20, life: 0.8 + Math.random() * 0.7, maxLife: 1.5, size: 5 + Math.random() * 6, color: "#555", grav: 0 });
}
function addFloater(x, y, text, color) {
  floaters.push({ x, y, text, color, life: 1 });
}
function shake(mag, t) { shakeMag = Math.max(shakeMag, mag); shakeT = Math.max(shakeT, t); }

// ---------- Physics ----------
const ACCEL = 420, MAXSPD = 330, BOOSTSPD = 470, TURN = 3.4, FRICTION = 1.6, WALL_E = 0.55;

function updateCar(c, dt) {
  if (c.wrecked) { c.wreckT += dt; return; }
  let thrust = 0, steer = 0;

  if (c.isPlayer) {
    if (keys["w"] || keys["arrowup"]) thrust = 1;
    if (keys["s"] || keys["arrowdown"]) thrust = -0.6;
    if (keys["a"] || keys["arrowleft"]) steer = -1;
    if (keys["d"] || keys["arrowright"]) steer = 1;
    const boosting = (keys[" "] || keys["shift"]) && c.boost > 0 && thrust > 0;
    if (boosting) { c.boost = Math.max(0, c.boost - 45 * dt); thrust = 1.7; }
    else c.boost = Math.min(100, c.boost + 14 * dt);
  } else {
    // AI: chase nearest living car
    let target = null, best = 1e9;
    for (const o of cars) {
      if (o === c || o.wrecked) continue;
      const d = Math.hypot(o.x - c.x, o.y - c.y);
      if (d < best) { best = d; target = o; }
    }
    c.wanderT -= dt;
    if (c.wanderT <= 0) { c.wander = (Math.random() - 0.5) * 1.2; c.wanderT = 0.6 + Math.random(); }
    if (target) {
      let desired = Math.atan2(target.y - c.y, target.x - c.x) + c.wander * 0.4;
      // wall avoidance
      const m = 90;
      if (c.x < m) desired = 0; else if (c.x > W - m) desired = Math.PI;
      if (c.y < m) desired = Math.PI / 2; else if (c.y > H - m) desired = -Math.PI / 2;
      if (c.x < m && c.y < m) desired = Math.PI / 4;
      let diff = desired - c.angle;
      while (diff > Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      steer = Math.max(-1, Math.min(1, diff * 2.2));
      thrust = Math.abs(diff) < 1.1 ? 1 : 0.4;
    }
  }

  const spd = Math.hypot(c.vx, c.vy);
  const maxS = c.isPlayer ? (thrust > 1.2 ? BOOSTSPD : MAXSPD) : MAXSPD * (0.82 + Math.min(wave, 6) * 0.035);
  c.angle += steer * TURN * dt * Math.min(1, spd / 120) * (thrust < 0 ? -1 : 1);
  const ax = Math.cos(c.angle) * ACCEL * thrust;
  const ay = Math.sin(c.angle) * ACCEL * thrust;
  c.vx += ax * dt; c.vy += ay * dt;

  // friction
  const f = Math.exp(-FRICTION * dt);
  c.vx *= f; c.vy *= f;
  if (spd > maxS) { const k = maxS / spd; c.vx *= k; c.vy *= k; }

  c.x += c.vx * dt; c.y += c.vy * dt;

  // walls
  const m = 26;
  let hitWall = false;
  if (c.x < m) { c.x = m; c.vx = Math.abs(c.vx) * WALL_E; hitWall = true; }
  if (c.x > W - m) { c.x = W - m; c.vx = -Math.abs(c.vx) * WALL_E; hitWall = true; }
  if (c.y < m) { c.y = m; c.vy = Math.abs(c.vy) * WALL_E; hitWall = true; }
  if (c.y > H - m) { c.y = H - m; c.vy = -Math.abs(c.vy) * WALL_E; hitWall = true; }
  if (hitWall && Math.abs(c.vx) + Math.abs(c.vy) > 160) {
    damage(c, (Math.abs(c.vx) + Math.abs(c.vy) - 140) * 0.05, false);
    spark(c.x, c.y, 6, "#ffe08a", 120);
  }

  // smoke when damaged
  if (c.health < 40) {
    c.smokeT -= dt;
    if (c.smokeT <= 0) {
      smoke(c.x - Math.cos(c.angle) * 16, c.y - Math.sin(c.angle) * 16);
      c.smokeT = c.health < 20 ? 0.06 : 0.15;
    }
  }
  if (c.hitFlash > 0) c.hitFlash -= dt;
}

function damage(c, amount, byPlayer) {
  if (c.wrecked || amount <= 0) return;
  c.health -= amount;
  c.hitFlash = 0.12;
  if (c.health <= 0) {
    c.wrecked = true;
    c.wreckT = 0;
    spark(c.x, c.y, 40, "#ff9a3a", 320);
    spark(c.x, c.y, 20, "#ffe08a", 200);
    for (let i = 0; i < 10; i++) smoke(c.x + (Math.random() - 0.5) * 30, c.y + (Math.random() - 0.5) * 30);
    scorches.push({ x: c.x, y: c.y, r: 34 });
    shake(14, 0.4);
    thump(60, 0.5, 0.35);
    thump(160, 0.2, 0.2);
    if (c.isPlayer) {
      setTimeout(() => { if (state === STATE.PLAY) gameOver(false); }, 900);
    } else {
      wrecks++;
      score += 100;
      addFloater(c.x, c.y, "+100", "#7dff9a");
      if (cars.every(o => o.isPlayer || o.wrecked)) {
        setTimeout(() => { if (state === STATE.PLAY) gameOver(true); }, 800);
      }
    }
  }
}

function collide(dt) {
  for (let i = 0; i < cars.length; i++) {
    for (let j = i + 1; j < cars.length; j++) {
      const a = cars[i], b = cars[j];
      if (a.wrecked && a.wreckT > 1.2) continue;
      if (b.wrecked && b.wreckT > 1.2) continue;
      const dx = b.x - a.x, dy = b.y - a.y;
      const dist = Math.hypot(dx, dy) || 0.001;
      const minD = a.r + b.r;
      if (dist < minD) {
        const nx = dx / dist, ny = dy / dist;
        const push = (minD - dist) / 2;
        a.x -= nx * push; a.y -= ny * push;
        b.x += nx * push; b.y += ny * push;
        const rvx = b.vx - a.vx, rvy = b.vy - a.vy;
        const rvn = rvx * nx + rvy * ny;
        if (rvn < 0) {
          const e = 0.85;
          const jimp = -(1 + e) * rvn / 2;
          a.vx -= jimp * nx; a.vy -= jimp * ny;
          b.vx += jimp * nx; b.vy += jimp * ny;
          const impact = Math.abs(rvn);
          if (impact > 70) {
            const dmg = (impact - 60) * 0.11;
            const aBoost = a.isPlayer && (keys[" "] || keys["shift"]);
            const bBoost = b.isPlayer && (keys[" "] || keys["shift"]);
            damage(b, dmg * (a.isPlayer && aBoost ? 1.5 : 1), a.isPlayer);
            damage(a, dmg * (b.isPlayer && bBoost ? 1.5 : 1), b.isPlayer);
            if (a.isPlayer && impact > 140) score += Math.round(impact * 0.1);
            if (b.isPlayer && impact > 140) score += Math.round(impact * 0.1);
            spark((a.x + b.x) / 2, (a.y + b.y) / 2, Math.min(18, 4 + impact / 25), "#ffd24a", 200);
            shake(Math.min(10, impact / 40), 0.2);
            thump(90 + Math.random() * 40, 0.15, Math.min(0.3, impact / 1200));
          }
        }
      }
    }
  }
}

// ---------- Render ----------
function drawCar(c) {
  ctx.save();
  ctx.translate(c.x, c.y);
  ctx.rotate(c.angle);
  if (c.wrecked) {
    ctx.globalAlpha = Math.max(0, 1 - c.wreckT / 1.2);
    ctx.fillStyle = "#3a3a3a";
    ctx.beginPath(); ctx.arc(0, 0, c.r, 0, 7); ctx.fill();
    ctx.restore();
    return;
  }
  // shadow
  ctx.fillStyle = "rgba(0,0,0,0.3)";
  ctx.beginPath(); ctx.ellipse(2, 3, c.r, c.r * 0.85, 0, 0, 7); ctx.fill();
  // wheels
  ctx.fillStyle = "#1c1c1c";
  [[-12, -14], [-12, 14], [12, -14], [12, 14]].forEach(([wx, wy]) => {
    ctx.fillRect(wx - 5, wy - 3, 10, 6);
  });
  // body
  ctx.fillStyle = c.hitFlash > 0 ? "#ffffff" : c.color;
  roundRect(-18, -11, 36, 22, 6); ctx.fill();
  // roof / windshield
  ctx.fillStyle = "rgba(20,25,40,0.75)";
  roundRect(-6, -8, 12, 16, 3); ctx.fill();
  ctx.fillStyle = "rgba(150,200,255,0.5)";
  ctx.fillRect(7, -8, 4, 16);
  // headlights
  ctx.fillStyle = "#fff3b0";
  ctx.fillRect(15, -9, 3, 5);
  ctx.fillRect(15, 4, 3, 5);
  // nitro flame
  if (c.isPlayer && (keys[" "] || keys["shift"]) && c.boost > 0) {
    ctx.fillStyle = Math.random() < 0.5 ? "#ff8c2e" : "#ffd24a";
    ctx.beginPath();
    ctx.moveTo(-18, -5); ctx.lineTo(-18 - 12 - Math.random() * 10, 0); ctx.lineTo(-18, 5);
    ctx.fill();
  }
  ctx.restore();
  // health bar (AI only)
  if (!c.isPlayer) {
    const w = 36;
    ctx.fillStyle = "rgba(0,0,0,0.55)";
    ctx.fillRect(c.x - w / 2, c.y - c.r - 14, w, 5);
    ctx.fillStyle = c.health > 55 ? "#5ad46a" : c.health > 25 ? "#ffc93a" : "#ff5340";
    ctx.fillRect(c.x - w / 2 + 1, c.y - c.r - 13, (w - 2) * Math.max(0, c.health) / c.maxHealth, 3);
  }
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  // arena bg
  ctx.fillStyle = "#2b2d33";
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  if (shakeT > 0) {
    ctx.translate((Math.random() - 0.5) * shakeMag, (Math.random() - 0.5) * shakeMag);
  }

  // scorch marks
  for (const s of scorches) {
    ctx.fillStyle = "rgba(0,0,0,0.4)";
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fill();
  }

  // arena wall
  ctx.strokeStyle = "#ffb020";
  ctx.lineWidth = 8;
  ctx.setLineDash([26, 18]);
  ctx.strokeRect(14, 14, W - 28, H - 28);
  ctx.setLineDash([]);

  // skid marks under fast cars
  for (const c of cars) {
    if (c.wrecked) continue;
    const spd = Math.hypot(c.vx, c.vy);
    if (spd > 200) {
      ctx.fillStyle = "rgba(0,0,0,0.18)";
      const bx = c.x - Math.cos(c.angle) * 14, by = c.y - Math.sin(c.angle) * 14;
      ctx.fillRect(bx - 3, by - 10, 6, 6);
      ctx.fillRect(bx - 3, by + 4, 6, 6);
    }
  }

  // particles
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;

  for (const c of cars) drawCar(c);

  // floaters
  ctx.font = "900 18px 'Arial Black', Arial";
  ctx.textAlign = "center";
  for (const f of floaters) {
    ctx.globalAlpha = Math.max(0, f.life);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y - (1 - f.life) * 40);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // ---- HUD ----
  const player = cars[0];
  if (player) {
    // health
    const bw = Math.min(260, W * 0.3);
    ctx.fillStyle = "rgba(0,0,0,0.55)";
    roundRect(16, 16, bw, 22, 8); ctx.fill();
    ctx.fillStyle = player.health > 55 ? "#5ad46a" : player.health > 25 ? "#ffc93a" : "#ff5340";
    if (player.health > 0) { roundRect(18, 18, (bw - 4) * Math.max(0, player.health) / 100, 18, 6); ctx.fill(); }
    ctx.font = "900 12px 'Arial Black', Arial";
    ctx.fillStyle = "#fff"; ctx.textAlign = "left";
    ctx.fillText("ARMOR", 24, 31);
    // nitro
    ctx.fillStyle = "rgba(0,0,0,0.55)";
    roundRect(16, 44, bw, 14, 6); ctx.fill();
    ctx.fillStyle = "#3ac8ff";
    if (player.boost > 1) { roundRect(18, 46, (bw - 4) * player.boost / 100, 10, 4); ctx.fill(); }
    ctx.fillStyle = "#fff";
    ctx.fillText("NITRO", 24, 55);
    // score
    ctx.font = "900 22px 'Arial Black', Arial";
    ctx.textAlign = "right";
    ctx.fillStyle = "#ffb020";
    ctx.fillText("SCORE " + score, W - 90, 34);
    ctx.font = "900 14px 'Arial Black', Arial";
    ctx.fillStyle = "#cfd6e4";
    ctx.fillText("WAVE " + wave + "  •  WRECKS " + wrecks + "  •  " + Math.floor(elapsed) + "s", W - 90, 56);
  }
}

// ---------- Loop ----------
let lastT = performance.now();
function frame(t) {
  let dt = Math.min(0.033, (t - lastT) / 1000);
  lastT = t;
  if (state === STATE.PLAY) {
    elapsed += dt;
    for (const c of cars) updateCar(c, dt);
    collide(dt);
    cars = cars.filter(c => !c.wrecked || c.wreckT < 1.2 || c.isPlayer);
    for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
    particles = particles.filter(p => p.life > 0);
    for (const f of floaters) f.life -= dt * 0.9;
    floaters = floaters.filter(f => f.life > 0);
    if (shakeT > 0) { shakeT -= dt; if (shakeT <= 0) shakeMag = 0; }
  }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>

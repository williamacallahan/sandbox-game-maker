<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Sky Dash</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0b2038;}
  #game{display:block;width:100vw;height:100vh;touch-action:none;cursor:crosshair;}
  #pauseBtn{
    position:fixed;top:10px;right:10px;z-index:5;
    width:46px;height:46px;border:0;border-radius:14px;
    background:rgba(8,25,45,.40);color:#fff;font-size:17px;line-height:1;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    box-shadow:0 4px 14px rgba(0,0,0,.22);
  }
  #pauseBtn:hover{background:rgba(8,25,45,.62);}
  #pauseBtn:active{transform:scale(.94);}
</style>
</head>
<body>
<canvas id="game"></canvas>
<button id="pauseBtn" aria-label="Pause game" title="Pause / Resume (P)">&#10074;&#10074;</button>
<script>
(function(){
'use strict';

var canvas=document.getElementById('game');
var ctx=canvas.getContext('2d');
var pauseBtn=document.getElementById('pauseBtn');

/* ---------- viewport / logical scaling (fills any aspect, no letterbox) ---------- */
var scale=1, dpr=1, cw=720, ch=720, VW=720, VH=720;
function resize(){
  cw=Math.max(1,window.innerWidth); ch=Math.max(1,window.innerHeight);
  dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.round(cw*dpr); canvas.height=Math.round(ch*dpr);
  canvas.style.width=cw+'px'; canvas.style.height=ch+'px';
  scale=Math.min(cw,ch)/720;
  VW=cw/scale; VH=ch/scale;
}
window.addEventListener('resize',resize);
resize();

/* ---------- tiny helpers ---------- */
function rand(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function pickOne(arr){return arr[(Math.random()*arr.length)|0];}
function hx(c){return [parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];}
function mix(a,b,t){var A=hx(a),B=hx(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','+Math.round(A[2]+(B[2]-A[2])*t)+')';}
function rr(x,y,w,h,r){
  r=Math.min(r,Math.abs(w)/2,Math.abs(h)/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function starPath(r1,r2,n,rot){
  ctx.beginPath();
  for(var i=0;i<n*2;i++){
    var a=rot+i*Math.PI/n, r=(i%2)?r2:r1;
    var x=Math.cos(a)*r, y=Math.sin(a)*r;
    if(i) ctx.lineTo(x,y); else ctx.moveTo(x,y);
  }
  ctx.closePath();
}
function heartPath(s){
  ctx.beginPath();
  ctx.moveTo(0,s*0.85);
  ctx.bezierCurveTo(-s*1.35,-s*0.15,-s*0.55,-s*1.15,0,-s*0.42);
  ctx.bezierCurveTo(s*0.55,-s*1.15,s*1.35,-s*0.15,0,s*0.85);
  ctx.closePath();
}

/* ---------- audio (WebAudio only, no assets / no network) ---------- */
var actx=null;
function initAudio(){
  if(actx) { if(actx.state==='suspended'){try{actx.resume();}catch(e){}} return; }
  try{ var AC=window.AudioContext||window.webkitAudioContext; if(AC) actx=new AC(); }catch(e){ actx=null; }
}
function tone(f0,f1,dur,wave,vol,when){
  if(!actx) return;
  try{
    var t=actx.currentTime+(when||0);
    var o=actx.createOscillator(), g=actx.createGain();
    o.type=wave; o.frequency.setValueAtTime(f0,t);
    o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t+dur+0.03);
  }catch(e){}
}
function sfx(k){
  if(!actx) return;
  if(k==='shoot') tone(900,300,0.07,'square',0.05);
  else if(k==='pop'){ tone(320,900,0.10,'triangle',0.12); tone(180,70,0.16,'sine',0.09,0.02); }
  else if(k==='clink') tone(1320,2100,0.10,'sine',0.10);
  else if(k==='pickup'){ tone(660,1320,0.09,'sine',0.12); tone(990,1980,0.10,'sine',0.09,0.06); }
  else if(k==='hurt'){ tone(300,60,0.30,'sawtooth',0.15); }
  else if(k==='over'){ tone(420,70,0.80,'sawtooth',0.13); }
  else if(k==='ui') tone(520,700,0.07,'sine',0.07);
  else if(k==='start') { tone(300,760,0.16,'triangle',0.11); tone(500,1200,0.18,'sine',0.08,0.08); }
}

/* ---------- game state ---------- */
var state='menu';            // menu | playing | paused | over
var T=0;                     // wall time (animations)
var elapsed=0, dist=0, score=0, best=0, kills=0;
var lives=3, invuln=0, shake=0, speed=200, fireCd=0;
var spawnT=1, pickT=1.4, heartT=16, overT=0, trailT=0;
var player={x:150,y:360,vx:0,vy:0,tilt:0,r:26};
var obstacles=[], bullets=[], pickups=[], parts=[], rings=[], clouds=[];
var keys={up:0,down:0,left:0,right:0,fire:0};
var pointer={x:0,y:0,active:0,firing:0,use:0};

var BALLOON_COLS=['#ff5d5d','#ffb703','#00d9a3','#4cc9f0','#c77dff','#ff8347'];

function makeCloud(anywhere,front){
  var r=rand(26,72), puffs=[], n=3+((Math.random()*4)|0), i;
  for(i=0;i<n;i++) puffs.push({dx:rand(-1,1)*r*0.95,dy:rand(-0.35,0.35)*r,r:rand(0.55,1)*r});
  return {
    x: anywhere? rand(-100,VW+100) : VW+rand(40,320),
    y: rand(15,VH-15), r:r, puffs:puffs,
    sm: front? rand(1.05,1.5) : rand(0.12,0.55),
    a: front? rand(0.12,0.26) : rand(0.45,0.9),
    front: !!front
  };
}
function reset(){
  elapsed=0; dist=0; score=0; kills=0;
  lives=3; invuln=0; shake=0; speed=200; fireCd=0;
  spawnT=1.1; pickT=1.3; heartT=15; overT=0; trailT=0;
  obstacles=[]; bullets=[]; pickups=[]; parts=[]; rings=[];
  player.x=Math.min(160,VW*0.22); player.y=VH*0.5;
  player.vx=0; player.vy=0; player.tilt=0;
  clouds=[];
  var i;
  for(i=0;i<13;i++) clouds.push(makeCloud(true,false));
  for(i=0;i<4;i++) clouds.push(makeCloud(true,true));
}

/* ---------- spawning ---------- */
function mkBird(x,y){
  return {type:'bird',x:x,y:y,baseY:y,r:16,lead:rand(70,150),hp:1,pts:35,t:rand(0,6),
          amp:rand(24,64),freq:rand(2.2,4.2),phase:rand(0,6.28),col:'#6b4a2f'};
}
function mkBalloon(x,y){
  return {type:'balloon',x:x,y:y,baseY:y,r:31,lead:rand(-40,20),hp:1,pts:45,t:rand(0,6),
          amp:16,freq:rand(0.7,1.3),phase:rand(0,6.28),col:pickOne(BALLOON_COLS)};
}
function mkJet(x,y){
  return {type:'jet',x:x,y:y,baseY:y,r:23,lead:rand(170,240),hp:2,pts:120,t:rand(0,6),
          amp:0,freq:0,phase:0,vy:rand(-70,70),col:'#8d99ae'};
}
function spawnObstacle(){
  var r=Math.random(), y=rand(70,VH-70);
  if(r<0.28){ obstacles.push(mkBalloon(VW+70,y)); }
  else if(r<0.58){ obstacles.push(mkBird(VW+60,y)); }
  else if(r<0.80){ obstacles.push(mkJet(VW+90,y)); }
  else {
    for(var i=0;i<3;i++){
      var b=mkBird(VW+60+i*52, clamp(y+(i-1)*52,60,VH-60));
      b.lead=90; b.freq=1.6+i*0.1; b.amp=26; b.phase=i; obstacles.push(b);
    }
  }
}

/* ---------- effects ---------- */
function explosion(x,y,col){
  var i,a,s;
  for(i=0;i<22;i++){
    a=rand(0,6.28); s=rand(60,340);
    parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,g:220,life:rand(0.3,0.8),max:0.8,
                r:rand(2.5,6.5),col:(i%3===0)?'#ffe08a':col});
  }
  for(i=0;i<6;i++){
    parts.push({x:x,y:y,vx:rand(-40,40),vy:rand(-70,-10),g:-20,life:rand(0.5,1.1),max:1.1,
                r:rand(8,16),col:'rgba(255,255,255,0.55)',smoke:1});
  }
  rings.push({x:x,y:y,r:6,life:0.32,max:0.32});
}
function sparks(x,y){
  for(var i=0;i<7;i++){
    var a=rand(0,6.28),s=rand(80,260);
    parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,g:280,life:rand(0.14,0.32),max:0.32,
                r:rand(1.6,3.4),col:'#ffd166'});
  }
}
function sparkle(x,y,col){
  for(var i=0;i<12;i++){
    var a=rand(0,6.28),s=rand(50,220);
    parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,g:60,life:rand(0.25,0.6),max:0.6,
                r:rand(2,4.5),col:col||'#fff3b0'});
  }
}
function floatText(x,y,msg,col){
  parts.push({x:x,y:y,vx:0,vy:-70,g:0,life:0.9,max:0.9,r:0,col:col||'#ffffff',txt:msg});
}

/* ---------- actions ---------- */
function fire(){
  fireCd=0.15;
  bullets.push({x:player.x+34,y:player.y-3,vx:900});
  sfx('shoot');
  shake=Math.max(shake,1.6);
}
function hitPlayer(){
  lives--; invuln=1.9; shake=17;
  explosion(player.x,player.y,'#e6394f');
  sfx('hurt');
  if(lives<=0){
    lives=0; state='over'; overT=0;
    best=Math.max(best,Math.round(score));
    sfx('over');
  }
}
function startGame(){ reset(); state='playing'; last=performance.now(); sfx('start'); }
function setPaused(p){
  if(p && state==='playing'){ state='paused'; sfx('ui'); }
  else if(!p && state==='paused'){ state='playing'; last=performance.now(); sfx('ui'); }
}
function togglePause(){
  if(state==='playing') setPaused(true);
  else if(state==='paused') setPaused(false);
  else if(state==='menu') startGame();
  else if(state==='over' && overT>0.5) startGame();
}

/* ---------- update ---------- */
function updatePlayer(dt){
  var acc=2100, max=540, ax=0, ay=0;
  if(keys.left) ax-=1;
  if(keys.right) ax+=1;
  if(keys.up) ay-=1;
  if(keys.down) ay+=1;
  if(ax||ay){
    var l=Math.sqrt(ax*ax+ay*ay); ax/=l; ay/=l; pointer.use=0;
  } else if(pointer.use && pointer.active){
    var dx=pointer.x-player.x, dy=pointer.y-player.y, d=Math.sqrt(dx*dx+dy*dy);
    if(d>3){
      var want=Math.min(max*1.35, d*7.5);
      player.vx += ((dx/d)*want - player.vx)*Math.min(1,12*dt);
      player.vy += ((dy/d)*want - player.vy)*Math.min(1,12*dt);
    } else { player.vx*=Math.exp(-9*dt); player.vy*=Math.exp(-9*dt); }
    ax=0; ay=0;
  }
  if(ax||ay){
    player.vx+=ax*acc*dt; player.vy+=ay*acc*dt;
  } else if(!pointer.use){
    var damp=Math.exp(-5*dt); player.vx*=damp; player.vy*=damp;
  }
  var sp=Math.sqrt(player.vx*player.vx+player.vy*player.vy);
  if(sp>max*1.4){ player.vx*=max*1.4/sp; player.vy*=max*1.4/sp; }
  player.x+=player.vx*dt; player.y+=player.vy*dt;
  player.x=clamp(player.x,42,VW*0.70);
  player.y=clamp(player.y,42,VH-42);
  var tt=clamp(player.vy/520,-1,1)*0.48;
  player.tilt += (tt-player.tilt)*Math.min(1,11*dt);
}

function update(dt){
  elapsed+=dt;
  speed=200+Math.min(310,elapsed*6.2);
  dist+=speed*dt;
  score+=speed*dt*0.05;
  invuln=Math.max(0,invuln-dt);
  fireCd-=dt;

  updatePlayer(dt);
  if((keys.fire||pointer.firing) && fireCd<=0) fire();

  var density=Math.max(1,VW/720);
  var d=Math.min(1,elapsed/80);
  spawnT-=dt;
  if(spawnT<=0){ spawnObstacle(); spawnT=rand(0.9,1.6)*(1-0.5*d)*density; }
  pickT-=dt;
  if(pickT<=0){ pickups.push({type:'star',x:VW+50,y:rand(70,VH-70),r:16,lead:rand(-30,25),spin:rand(0,6)}); pickT=rand(1.7,3.1)*density; }
  heartT-=dt;
  if(heartT<=0){ if(lives<3) pickups.push({type:'heart',x:VW+50,y:rand(70,VH-70),r:17,lead:0,spin:0}); heartT=rand(20,28); }

  var i,o,b,p;
  for(i=0;i<bullets.length;i++){ bullets[i].x+=bullets[i].vx*dt; }
  bullets=bullets.filter(function(bb){return bb.x<VW+70;});

  for(i=0;i<obstacles.length;i++){
    o=obstacles[i];
    o.x-=(speed+o.lead)*dt;
    o.t+=dt;
    if(o.type==='bird') o.y=o.baseY+Math.sin(o.t*o.freq+o.phase)*o.amp;
    else if(o.type==='balloon') o.y=o.baseY+Math.sin(o.t*o.freq+o.phase)*o.amp;
    else { o.y+=o.vy*dt; if(o.y<55||o.y>VH-55){o.vy*=-1;} o.y=clamp(o.y,55,VH-55); }
  }
  obstacles=obstacles.filter(function(oo){return oo.x>-130 && !oo.dead;});

  for(i=0;i<pickups.length;i++){ p=pickups[i]; p.x-=(speed+p.lead)*dt; p.spin+=dt*2.2; }
  pickups=pickups.filter(function(pp){return pp.x>-70 && !pp.dead;});

  /* bullets vs obstacles */
  for(i=0;i<bullets.length;i++){
    b=bullets[i];
    for(var j=0;j<obstacles.length;j++){
      o=obstacles[j];
      if(o.dead) continue;
      var ddx=b.x-o.x, ddy=b.y-o.y, rad=o.r+5;
      if(ddx*ddx+ddy*ddy<rad*rad){
        b.dead=1; o.hp--; sparks(b.x,b.y);
        if(o.hp<=0){
          o.dead=1; kills++; score+=o.pts; sfx('pop');
          explosion(o.x,o.y,o.col);
          floatText(o.x,o.y-24,'+'+o.pts,'#ffe08a');
          if(o.type==='jet' && Math.random()<0.55) pickups.push({type:'star',x:o.x,y:o.y,r:16,lead:-90,spin:0});
        } else { sfx('clink'); }
        break;
      }
    }
  }
  bullets=bullets.filter(function(bb){return !bb.dead;});
  obstacles=obstacles.filter(function(oo){return !oo.dead;});

  /* player vs obstacles */
  if(invuln<=0){
    for(i=0;i<obstacles.length;i++){
      o=obstacles[i];
      var px=player.x-o.x, py=player.y-o.y, pr=player.r*0.66+o.r*0.82;
      if(px*px+py*py<pr*pr){
        explosion(o.x,o.y,o.col);
        o.dead=1;
        hitPlayer();
        break;
      }
    }
    obstacles=obstacles.filter(function(oo){return !oo.dead;});
  }

  /* player vs pickups */
  for(i=0;i<pickups.length;i++){
    p=pickups[i];
    var qx=player.x-p.x, qy=player.y-p.y, qr=player.r*0.9+p.r;
    if(qx*qx+qy*qy<qr*qr){
      p.dead=1;
      if(p.type==='star'){ score+=80; sparkle(p.x,p.y,'#ffe08a'); floatText(p.x,p.y-22,'+80','#ffe08a'); sfx('pickup'); }
      else { lives=Math.min(5,lives+1); sparkle(p.x,p.y,'#ff5d8f'); floatText(p.x,p.y-22,'+1 LIFE','#ff9db8'); sfx('pickup'); }
    }
  }
  pickups=pickups.filter(function(pp){return !pp.dead;});

  updateEffects(dt);
}

function updateEffects(dt){
  var i;
  for(i=0;i<clouds.length;i++){
    var c=clouds[i];
    c.x-=speed*c.sm*dt;
    if(c.x < -c.r*3.4){ c.x=VW+rand(30,300)+c.r; c.y=rand(15,VH-15); }
  }
  for(i=0;i<parts.length;i++){
    var q=parts[i];
    q.x+=q.vx*dt; q.y+=q.vy*dt; q.vy+=q.g*dt;
    if(q.smoke){ q.vx*=Math.exp(-2*dt); q.r+=18*dt; }
    q.life-=dt;
  }
  parts=parts.filter(function(a){return a.life>0;});
  for(i=0;i<rings.length;i++){ var rg=rings[i]; rg.r+=(360-rg.r*4)*dt; rg.life-=dt; }
  rings=rings.filter(function(a){return a.life>0;});
  shake*=Math.exp(-6*dt);
  if(shake<0.15) shake=0;

  /* engine trail */
  trailT-=dt;
  if(trailT<=0 && state!=='paused' && state!=='over'){
    trailT=0.026;
    var ex=player.x-Math.cos(player.tilt)*34, ey=player.y-Math.sin(player.tilt)*34;
    parts.push({x:ex,y:ey,vx:-60-speed*0.25,vy:rand(-16,16),g:-14,
                life:rand(0.4,0.85),max:0.85,r:rand(2.4,5),col:'rgba(255,255,255,0.5)',smoke:1});
  }
  if(state==='menu'){
    player.y=VH*0.5+Math.sin(T*1.3)*32;
    player.tilt=Math.cos(T*1.3)*0.14;
  }
}

/* ---------- drawing ---------- */
function drawSky(){
  var t=(Math.sin(T*0.045)+1)/2;
  var g=ctx.createLinearGradient(0,0,0,ch);
  g.addColorStop(0,mix('#1668bd','#54b2ff',t));
  g.addColorStop(0.55,mix('#63bff0','#a6e2ff',t));
  g.addColorStop(1,mix('#cfeeff','#f2fbff',t));
  ctx.fillStyle=g; ctx.fillRect(0,0,cw,ch);
  var sx=cw*0.76, sy=ch*0.15, R=Math.max(cw,ch)*0.42;
  var rg=ctx.createRadialGradient(sx,sy,0,sx,sy,R);
  rg.addColorStop(0,'rgba(255,248,208,0.85)');
  rg.addColorStop(0.22,'rgba(255,236,164,0.30)');
  rg.addColorStop(1,'rgba(255,236,164,0)');
  ctx.fillStyle=rg; ctx.fillRect(0,0,cw,ch);
  ctx.fillStyle='rgba(255,252,232,0.95)';
  ctx.beginPath(); ctx.arc(sx,sy,32,0,6.2832); ctx.fill();
}
function drawCloud(c){
  ctx.globalAlpha=c.a;
  ctx.fillStyle='#ffffff';
  for(var i=0;i<c.puffs.length;i++){
    var p=c.puffs[i];
    ctx.beginPath(); ctx.arc(c.x+p.dx,c.y+p.dy,p.r,0,6.2832); ctx.fill();
  }
  ctx.globalAlpha=1;
}
function drawProp(x,y,r){
  var s=Math.abs(Math.sin(T*26));
  ctx.fillStyle='rgba(255,255,255,'+(0.16+0.22*s)+')';
  ctx.beginPath(); ctx.ellipse(x,y,3.5,r,0,0,6.2832); ctx.fill();
  ctx.strokeStyle='rgba(40,40,50,0.55)'; ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(x,y-r*s); ctx.lineTo(x,y+r*s); ctx.stroke();
  ctx.fillStyle='#2b3040';
  ctx.beginPath(); ctx.arc(x,y,3.2,0,6.2832); ctx.fill();
}
function drawPlayer(){
  var flick=(invuln>0 && (Math.floor(T*16)%2===0));
  ctx.save();
  ctx.translate(player.x,player.y);
  ctx.rotate(player.tilt);
  ctx.globalAlpha=flick?0.35:1;

  ctx.fillStyle='rgba(0,0,0,0.10)';
  ctx.beginPath(); ctx.ellipse(0,20,34,7,0,0,6.2832); ctx.fill();

  /* far wing (up) */
  ctx.fillStyle='#9c1330';
  ctx.beginPath(); ctx.moveTo(-4,-5); ctx.lineTo(15,-5); ctx.lineTo(7,-28); ctx.lineTo(-13,-26); ctx.closePath(); ctx.fill();

  /* tail fin */
  ctx.fillStyle='#f6f9fd';
  ctx.beginPath(); ctx.moveTo(-25,-6); ctx.lineTo(-40,-31); ctx.lineTo(-16,-7); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#e6394f';
  ctx.beginPath(); ctx.moveTo(-32,-8); ctx.lineTo(-40,-31); ctx.lineTo(-30,-8); ctx.closePath(); ctx.fill();

  /* horizontal stabilizer */
  ctx.fillStyle='#c9d6e6';
  ctx.beginPath(); ctx.moveTo(-24,2); ctx.lineTo(-40,10); ctx.lineTo(-28,4); ctx.closePath(); ctx.fill();

  /* fuselage */
  ctx.fillStyle='#e6394f'; rr(-33,-13,66,25,12); ctx.fill();
  ctx.fillStyle='#ff7d8d'; rr(-30,-11,58,7,3.5); ctx.fill();
  ctx.fillStyle='#a1152f'; rr(-30,7,60,5,2.5); ctx.fill();

  /* stripe */
  ctx.fillStyle='#ffd166'; rr(-33,-1,64,4,2); ctx.fill();

  /* cockpit */
  ctx.fillStyle='#0e2a44'; rr(-12,-19,24,12,6); ctx.fill();
  ctx.fillStyle='#9fe3ff'; ctx.beginPath();
  ctx.moveTo(-11,-8); ctx.lineTo(-6,-17); ctx.lineTo(7,-17); ctx.lineTo(11,-8); ctx.closePath(); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.55)'; ctx.beginPath();
  ctx.moveTo(-8,-9); ctx.lineTo(-4,-16); ctx.lineTo(-1,-16); ctx.lineTo(-5,-9); ctx.closePath(); ctx.fill();

  /* near wing (down) */
  ctx.fillStyle='#fdfdfd';
  ctx.beginPath(); ctx.moveTo(-3,4); ctx.lineTo(19,5); ctx.lineTo(9,32); ctx.lineTo(-15,30); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#e6394f';
  ctx.beginPath(); ctx.moveTo(-2,12); ctx.lineTo(16,13); ctx.lineTo(13,20); ctx.lineTo(-5,19); ctx.closePath(); ctx.fill();

  /* nose + prop */
  ctx.fillStyle='#ffd166';
  ctx.beginPath(); ctx.moveTo(28,-11); ctx.lineTo(36,0); ctx.lineTo(28,11); ctx.closePath(); ctx.fill();
  drawProp(35,0,17);

  ctx.restore();
}
function drawBird(o){
  ctx.save(); ctx.translate(o.x,o.y);
  var flap=Math.sin(o.t*14);
  ctx.fillStyle='rgba(0,0,0,0.08)';
  ctx.beginPath(); ctx.ellipse(0,12,14,4,0,0,6.2832); ctx.fill();
  /* tail */
  ctx.fillStyle='#4b3220';
  ctx.beginPath(); ctx.moveTo(12,-2); ctx.lineTo(24,-8); ctx.lineTo(23,3); ctx.closePath(); ctx.fill();
  /* body */
  ctx.fillStyle='#6b4a2f';
  ctx.beginPath(); ctx.ellipse(0,0,16,10,0,0,6.2832); ctx.fill();
  /* wing */
  ctx.fillStyle='#8a6440';
  ctx.beginPath();
  ctx.moveTo(-2,-3); ctx.lineTo(11,-2);
  ctx.lineTo(3,-6-18*flap); ctx.lineTo(-11,-4-13*flap);
  ctx.closePath(); ctx.fill();
  /* head */
  ctx.fillStyle='#7a5638';
  ctx.beginPath(); ctx.arc(-13,-3,7.5,0,6.2832); ctx.fill();
  /* beak */
  ctx.fillStyle='#ffb703';
  ctx.beginPath(); ctx.moveTo(-19,-4); ctx.lineTo(-27,-1); ctx.lineTo(-19,1); ctx.closePath(); ctx.fill();
  /* eye */
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(-15,-5,2.6,0,6.2832); ctx.fill();
  ctx.fillStyle='#1b1b1b'; ctx.beginPath(); ctx.arc(-15.6,-5,1.3,0,6.2832); ctx.fill();
  ctx.restore();
}
function drawBalloon(o){
  ctx.save(); ctx.translate(o.x,o.y);
  var r=o.r, sway=Math.sin(o.t*o.freq*0.8+o.phase)*0.10;
  ctx.rotate(sway);
  /* basket + ropes */
  ctx.strokeStyle='rgba(80,60,40,0.9)'; ctx.lineWidth=1.6;
  ctx.beginPath();
  ctx.moveTo(-7,r*0.92); ctx.lineTo(-6,r+12);
  ctx.moveTo(7,r*0.92); ctx.lineTo(6,r+12);
  ctx.stroke();
  ctx.fillStyle='#8d5a2b'; rr(-9,r+11,18,11,3); ctx.fill();
  ctx.fillStyle='#a86c36'; rr(-9,r+11,18,4,2); ctx.fill();
  /* envelope */
  ctx.fillStyle=o.col;
  ctx.beginPath(); ctx.moveTo(0,-r);
  ctx.bezierCurveTo(r*1.05,-r*0.9, r*0.95,r*0.35, 0,r*0.95);
  ctx.bezierCurveTo(-r*0.95,r*0.35, -r*1.05,-r*0.9, 0,-r);
  ctx.fill();
  /* gores */
  ctx.strokeStyle='rgba(255,255,255,0.45)'; ctx.lineWidth=2.4;
  for(var i=-1;i<=1;i++){
    ctx.beginPath();
    ctx.moveTo(0,-r*0.98);
    ctx.bezierCurveTo(i*r*0.95,-r*0.5, i*r*0.9,r*0.5, 0,r*0.93);
    ctx.stroke();
  }
  ctx.fillStyle='rgba(255,255,255,0.35)';
  ctx.beginPath(); ctx.ellipse(-r*0.38,-r*0.3,r*0.18,r*0.34,-0.4,0,6.2832); ctx.fill();
  /* burner */
  ctx.fillStyle='#ffd166'; rr(-5,r*0.9,10,6,2); ctx.fill();
  ctx.restore();
}
function drawJet(o){
  ctx.save(); ctx.translate(o.x,o.y);
  var dir=(o.vy>0)?1:-1;
  /* afterburner (trailing right) */
  var f=0.6+0.4*Math.sin(o.t*30);
  ctx.fillStyle='rgba(255,180,60,0.85)';
  ctx.beginPath(); ctx.moveTo(22,-4); ctx.lineTo(22,4); ctx.lineTo(22+20*f,0); ctx.closePath(); ctx.fill();
  ctx.fillStyle='rgba(255,240,180,0.9)';
  ctx.beginPath(); ctx.moveTo(22,-2); ctx.lineTo(22,2); ctx.lineTo(22+10*f,0); ctx.closePath(); ctx.fill();
  /* far wing */
  ctx.fillStyle='#6b7688';
  ctx.beginPath(); ctx.moveTo(2,-2); ctx.lineTo(16,-2); ctx.lineTo(6,-22); ctx.lineTo(-4,-20); ctx.closePath(); ctx.fill();
  /* fuselage */
  ctx.fillStyle='#9aa7b8'; rr(-26,-9,50,18,9); ctx.fill();
  ctx.fillStyle='#c3ceda'; rr(-24,-8,46,6,3); ctx.fill();
  /* canopy */
  ctx.fillStyle='#2b3d55';
  ctx.beginPath(); ctx.moveTo(-16,-7); ctx.lineTo(-2,-7); ctx.lineTo(-6,2); ctx.lineTo(-16,2); ctx.closePath(); ctx.fill();
  /* nose */
  ctx.fillStyle='#5b6675';
  ctx.beginPath(); ctx.moveTo(-24,-8); ctx.lineTo(-38,0); ctx.lineTo(-24,8); ctx.closePath(); ctx.fill();
  /* tail */
  ctx.fillStyle='#e6394f';
  ctx.beginPath(); ctx.moveTo(16,-6); ctx.lineTo(26,-20); ctx.lineTo(24,-4); ctx.closePath(); ctx.fill();
  /* near wing */
  ctx.fillStyle='#b9c4d2';
  ctx.beginPath(); ctx.moveTo(-2,3); ctx.lineTo(16,4); ctx.lineTo(6,26); ctx.lineTo(-12,24); ctx.closePath(); ctx.fill();
  /* warning light blink */
  if(Math.floor(T*4)%2===0){ ctx.fillStyle='#ff4d4d'; ctx.beginPath(); ctx.arc(20,-8*dir-2,2.4,0,6.2832); ctx.fill(); }
  ctx.restore();
}
function drawPickup(p){
  ctx.save(); ctx.translate(p.x,p.y+Math.sin(T*3+p.x*0.02)*4);
  if(p.type==='star'){
    var g=ctx.createRadialGradient(0,0,2,0,0,26);
    g.addColorStop(0,'rgba(255,240,170,0.65)'); g.addColorStop(1,'rgba(255,240,170,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,26,0,6.2832); ctx.fill();
    ctx.fillStyle='#ffd166'; starPath(16,7,5,-Math.PI/2+p.spin*0.4); ctx.fill();
    ctx.fillStyle='#fff3b0'; starPath(9,4,5,-Math.PI/2+p.spin*0.4); ctx.fill();
  } else {
    var g2=ctx.createRadialGradient(0,0,2,0,0,28);
    g2.addColorStop(0,'rgba(255,120,160,0.55)'); g2.addColorStop(1,'rgba(255,120,160,0)');
    ctx.fillStyle=g2; ctx.beginPath(); ctx.arc(0,0,28,0,6.2832); ctx.fill();
    ctx.fillStyle='#ff4d79'; heartPath(15); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.6)';
    ctx.beginPath(); ctx.ellipse(-5,-5,3.5,5.5,-0.5,0,6.2832); ctx.fill();
  }
  ctx.restore();
}
function drawBullets(){
  for(var i=0;i<bullets.length;i++){
    var b=bullets[i];
    ctx.fillStyle='rgba(255,220,120,0.35)';
    rr(b.x-22,b.y-4,30,8,4); ctx.fill();
    ctx.fillStyle='#ffd166';
    rr(b.x-12,b.y-2.2,18,4.4,2.2); ctx.fill();
    ctx.fillStyle='#fff8dd';
    ctx.beginPath(); ctx.arc(b.x+6,b.y,2.6,0,6.2832); ctx.fill();
  }
}
function drawParticles(){
  for(var i=0;i<parts.length;i++){
    var q=parts[i], a=clamp(q.life/q.max,0,1);
    ctx.globalAlpha=a;
    if(q.txt){
      ctx.font='bold 22px "Trebuchet MS", system-ui, sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.lineWidth=4; ctx.strokeStyle='rgba(10,25,45,0.65)';
      ctx.strokeText(q.txt,q.x,q.y);
      ctx.fillStyle=q.col; ctx.fillText(q.txt,q.x,q.y);
    } else {
      ctx.fillStyle=q.col;
      ctx.beginPath(); ctx.arc(q.x,q.y,q.r*(q.smoke?(1.6-a*0.6):1),0,6.2832); ctx.fill();
    }
    ctx.globalAlpha=1;
  }
  for(var j=0;j<rings.length;j++){
    var rg=rings[j], ra=clamp(rg.life/rg.max,0,1);
    ctx.globalAlpha=ra*0.8;
    ctx.strokeStyle='#ffffff'; ctx.lineWidth=3*ra+1;
    ctx.beginPath(); ctx.arc(rg.x,rg.y,rg.r,0,6.2832); ctx.stroke();
    ctx.globalAlpha=1;
  }
}
function drawHUD(){
  ctx.textBaseline='middle'; ctx.textAlign='left';
  var pad=18;
  /* score plaque */
  ctx.fillStyle='rgba(8,25,45,0.34)';
  rr(pad,pad,196,74,16); ctx.fill();
  ctx.fillStyle='#ffffff';
  ctx.font='bold 34px "Trebuchet MS", system-ui, sans-serif';
  ctx.fillText(''+Math.round(score),pad+14,pad+28);
  ctx.font='600 14px "Trebuchet MS", system-ui, sans-serif';
  ctx.fillStyle='rgba(255,255,255,0.80)';
  ctx.fillText('SCORE',pad+14,pad+54);
  ctx.textAlign='right';
  ctx.fillText((dist/1400).toFixed(2)+' KM',pad+182,pad+54);
  ctx.fillStyle='rgba(255,240,170,0.95)';
  ctx.font='bold 20px "Trebuchet MS", system-ui, sans-serif';
  ctx.fillText('BEST '+Math.max(best,Math.round(score)),pad+182,pad+28);
  ctx.textAlign='left';

  /* hearts */
  var hx0=pad+2, hy0=pad+104;
  for(var i=0;i<Math.max(lives,3);i++){
    ctx.save(); ctx.translate(hx0+i*34+14,hy0+12);
    if(i<lives){
      ctx.fillStyle='#ff4d79'; heartPath(12); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.55)';
      ctx.beginPath(); ctx.ellipse(-4,-4,2.6,4.2,-0.5,0,6.2832); ctx.fill();
    } else {
      ctx.strokeStyle='rgba(255,255,255,0.40)'; ctx.lineWidth=2; heartPath(12); ctx.stroke();
    }
    ctx.restore();
  }
  /* throttle bar */
  var bw=170, bx=VW-bw-70, by=VH-34;
  ctx.fillStyle='rgba(8,25,45,0.30)'; rr(bx-10,by-16,bw+78,32,16); ctx.fill();
  var f=clamp((speed-200)/310,0,1);
  ctx.fillStyle='rgba(255,255,255,0.25)'; rr(bx,by-4,bw,9,4.5); ctx.fill();
  ctx.fillStyle=mix('#ffe08a','#ff6b6b',f); rr(bx,by-4,Math.max(8,bw*f),9,4.5); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.9)';
  ctx.font='600 13px "Trebuchet MS", system-ui, sans-serif'; ctx.textAlign='left';
  ctx.fillText('THROTTLE',bx+bw+8,by);
}
function panel(w2,h2){
  ctx.fillStyle='rgba(6,20,38,0.35)'; ctx.fillRect(-VW,-VH,VW*3,VH*3);
  ctx.fillStyle='rgba(8,24,45,0.80)';
  rr(-w2/2,-h2/2,w2,h2,22); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.22)'; ctx.lineWidth=2;
  rr(-w2/2,-h2/2,w2,h2,22); ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,0.10)';
  rr(-w2/2+10,-h2/2+10,w2-20,10,6); ctx.fill();
}
function label(s,x,y,size,col,align,weight){
  ctx.font=(weight||'bold')+' '+size+'px "Trebuchet MS", system-ui, sans-serif';
  ctx.textAlign=align||'center'; ctx.textBaseline='middle';
  ctx.lineWidth=size*0.16; ctx.strokeStyle='rgba(5,16,32,0.55)';
  ctx.strokeText(s,x,y);
  ctx.fillStyle=col||'#fff'; ctx.fillText(s,x,y);
}
function drawMenu(){
  ctx.save(); ctx.translate(VW/2,VH/2);
  var w=Math.min(VW-60,520), h=Math.min(VH-60,470);
  panel(w,h);
  var pulse=0.5+0.5*Math.sin(T*3);
  label('SKY DASH',0,-h/2+62,Math.min(60,w*0.15),'#ffd166');
  ctx.fillStyle='rgba(255,209,102,'+(0.35+0.4*pulse)+')';
  rr(-70,-h/2+88,140,3,2); ctx.fill();
  label('Fly fast. Shoot things. Don\u2019t crash.',0,-h/2+118,19,'rgba(255,255,255,0.88)','center','600');
  var lines=[
    ['STEER','WASD \u00b7 Arrows \u00b7 Mouse \u00b7 Drag'],
    ['SHOOT','Space \u00b7 Click / Tap'],
    ['PAUSE','P \u00b7 Esc \u00b7 \u275a\u275a button'],
    ['BONUS','\u2605 +80 pts   \u2665 extra heart']
  ];
  var y0=-h/2+162;
  for(var i=0;i<lines.length;i++){
    label(lines[i][0],-46,y0+i*40,15,'#9fe3ff','right','800');
    label(lines[i][1],-30,y0+i*40,17,'rgba(255,255,255,0.92)','left','600');
  }
  ctx.globalAlpha=0.45+0.55*pulse;
  label('PRESS ANY KEY OR TAP TO LAUNCH',0,h/2-44,Math.min(21,w*0.052),'#ffffff');
  ctx.globalAlpha=1;
  if(best>0) label('BEST '+best,0,h/2-104,17,'rgba(255,240,170,0.9)');
  ctx.restore();
}
function drawPauseOverlay(){
  ctx.save(); ctx.translate(VW/2,VH/2);
  var w=Math.min(VW-80,420), h=Math.min(VH-80,300);
  panel(w,h);
  label('\u275a\u275a',0,-h/2+52,38,'#9fe3ff');
  label('PAUSED',0,-h/2+102,Math.min(46,w*0.14),'#ffd166');
  label('Score '+Math.round(score)+'   \u00b7   Hearts '+lives,0,-h/2+146,18,'rgba(255,255,255,0.9)','center','600');
  var pulse=0.5+0.5*Math.sin(T*3);
  ctx.globalAlpha=0.5+0.5*pulse;
  label('Press P / Esc, or tap anywhere to resume',0,h/2-54,17,'#ffffff','center','600');
  ctx.globalAlpha=1;
  label('Hold Space or tap to keep shooting',0,h/2-24,14,'rgba(255,255,255,0.55)','center','600');
  ctx.restore();
}
function drawOverOverlay(){
  ctx.save(); ctx.translate(VW/2,VH/2);
  var a=clamp(overT/0.35,0,1);
  ctx.globalAlpha=a;
  var w=Math.min(VW-70,440), h=Math.min(VH-70,340);
  panel(w,h);
  label('SHOT DOWN!',0,-h/2+58,Math.min(46,w*0.13),'#ff6b6b');
  label('SCORE',0,-h/2+104,15,'rgba(255,255,255,0.65)','center','800');
  label(''+Math.round(score),0,-h/2+142,44,'#ffd166');
  label('DISTANCE '+(dist/1400).toFixed(2)+' KM   \u00b7   KILLS '+kills,0,-h/2+180,16,'rgba(255,255,255,0.88)','center','600');
  label('BEST '+Math.max(best,Math.round(score)),0,-h/2+208,16,'rgba(159,227,255,0.95)','center','800');
  if(overT>0.5){
    var pulse=0.5+0.5*Math.sin(T*3.4);
    ctx.globalAlpha=0.5+0.5*pulse;
    label('TAP OR PRESS ANY KEY TO FLY AGAIN',0,h/2-40,Math.min(19,w*0.048),'#ffffff','center','700');
  }
  ctx.globalAlpha=1;
  ctx.restore();
}

function render(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  drawSky();
  var s=scale*dpr;
  var ox=(Math.random()-0.5)*shake*scale, oy=(Math.random()-0.5)*shake*scale;
  ctx.setTransform(s,0,0,s,ox*s,oy*s);

  var i;
  for(i=0;i<clouds.length;i++) if(!clouds[i].front) drawCloud(clouds[i]);
  for(i=0;i<pickups.length;i++) drawPickup(pickups[i]);
  for(i=0;i<obstacles.length;i++){
    var o=obstacles[i];
    if(o.type==='bird') drawBird(o);
    else if(o.type==='balloon') drawBalloon(o);
    else drawJet(o);
  }
  drawBullets();
  if(!(state==='over' && overT>0.35)) drawPlayer();
  drawParticles();
  for(i=0;i<clouds.length;i++) if(clouds[i].front) drawCloud(clouds[i]);

  ctx.setTransform(s,0,0,s,0,0);
  if(state!=='menu') drawHUD();
  if(state==='menu') drawMenu();
  else if(state==='paused') drawPauseOverlay();
  else if(state==='over') drawOverOverlay();
}

/* ---------- loop ---------- */
var last=performance.now();
function frame(now){
  var dt=(now-last)/1000; last=now;
  if(dt>0.05) dt=0.05;
  if(!(dt>0)) dt=0;
  T+=dt;
  if(state==='playing'){
    update(dt);
  } else if(state==='menu'){
    speed=170; updateEffects(dt);
  } else if(state==='over'){
    overT+=dt; speed*=Math.exp(-0.9*dt); updateEffects(dt);
  }
  render();
  requestAnimationFrame(frame);
}

/* ---------- input ---------- */
function toLocal(px,py){
  var r=canvas.getBoundingClientRect();
  return {x:(px-r.left)/scale, y:(py-r.top)/scale};
}
window.addEventListener('keydown',function(e){
  var k=e.key.toLowerCase();
  if(k===' '||k==='spacebar'||k.indexOf('arrow')===0) e.preventDefault();
  initAudio();
  if(k==='p'||k==='escape'){ togglePause(); return; }
  if(state==='menu'){ startGame(); return; }
  if(state==='over'){ if(overT>0.5) startGame(); return; }
  if(k==='arrowup'||k==='w') keys.up=1;
  if(k==='arrowdown'||k==='s') keys.down=1;
  if(k==='arrowleft'||k==='a') keys.left=1;
  if(k==='arrowright'||k==='d') keys.right=1;
  if(k===' '||k==='spacebar'||k==='f'||k==='j'||k==='enter') keys.fire=1;
},{passive:false});
window.addEventListener('keyup',function(e){
  var k=e.key.toLowerCase();
  if(k==='arrowup'||k==='w') keys.up=0;
  if(k==='arrowdown'||k==='s') keys.down=0;
  if(k==='arrowleft'||k==='a') keys.left=0;
  if(k==='arrowright'||k==='d') keys.right=0;
  if(k===' '||k==='spacebar'||k==='f'||k==='j'||k==='enter') keys.fire=0;
});

canvas.addEventListener('pointermove',function(e){
  var p=toLocal(e.clientX,e.clientY);
  if(e.pointerType!=='mouse') p.y-=70;
  pointer.x=clamp(p.x,0,VW); pointer.y=clamp(p.y,0,VH);
  pointer.active=1;
  if(e.pointerType==='mouse' || e.buttons>0 || e.pressure>0) pointer.use=1;
});
canvas.addEventListener('pointerdown',function(e){
  initAudio();
  e.preventDefault();
  var p=toLocal(e.clientX,e.clientY);
  if(e.pointerType!=='mouse') p.y-=70;
  pointer.x=clamp(p.x,0,VW); pointer.y=clamp(p.y,0,VH);
  pointer.active=1; pointer.use=1;
  try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
  if(state==='menu'){ startGame(); return; }
  if(state==='paused'){ setPaused(false); return; }
  if(state==='over'){ if(overT>0.5) startGame(); return; }
  pointer.firing=1;
});
function stopFire(){ pointer.firing=0; }
canvas.addEventListener('pointerup',stopFire);
canvas.addEventListener('pointercancel',stopFire);
canvas.addEventListener('contextmenu',function(e){ e.preventDefault(); });

pauseBtn.addEventListener('click',function(e){
  e.preventDefault(); e.stopPropagation();
  initAudio(); togglePause();
});

window.addEventListener('blur',function(){ if(state==='playing') setPaused(true); });
document.addEventListener('visibilitychange',function(){ if(document.hidden && state==='playing') setPaused(true); });

/* host may ask us to clear any overlay */
window.addEventListener('message',function(e){
  var d=e.data;
  if(d && d.type==='game-maker:dismiss-overlay'){
    if(state==='paused') setPaused(false);
    else if(state==='menu') startGame();
    else if(state==='over') startGame();
  }
});

reset();
state='menu';
requestAnimationFrame(frame);
})();
</script>
</body>
</html>

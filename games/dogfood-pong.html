<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            font-family: monospace;
            color: #0f0;
        }
        canvas {
            display: block;
            background: #000;
            border: 2px solid #0f0;
            touch-action: none;
        }
        #score {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div id="score">Score: 0</div>
    <canvas id="pong"></canvas>

    <script>
        const canvas = document.getElementById('pong');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');

        // Resize canvas to fill viewport as square
        function resizeCanvas() {
            const size = Math.min(window.innerWidth, window.innerHeight);
            canvas.width = size;
            canvas.height = size;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Game state
        let score = 0;
        let mouseX = canvas.width / 2;

        // Paddle
        const paddle = {
            x: canvas.width / 2 - 40,
            y: canvas.height - 20,
            width: 80,
            height: 10,
            speed: 8
        };

        // Ball
        const ball = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 5,
            vx: 4,
            vy: -4
        };

        // Pointer tracking
        canvas.addEventListener('pointerdown', () => {});
        canvas.addEventListener('pointermove', (e) => {
            mouseX = e.clientX - canvas.getBoundingClientRect().left;
        });

        function update() {
            // Move paddle toward mouse
            if (mouseX < paddle.x + paddle.width / 2 - 5) {
                paddle.x -= paddle.speed;
            } else if (mouseX > paddle.x + paddle.width / 2 + 5) {
                paddle.x += paddle.speed;
            }

            // Keep paddle in bounds
            if (paddle.x < 0) paddle.x = 0;
            if (paddle.x + paddle.width > canvas.width) paddle.x = canvas.width - paddle.width;

            // Move ball
            ball.x += ball.vx;
            ball.y += ball.vy;

            // Ball collision with walls
            if (ball.x - ball.radius < 0 || ball.x + ball.radius > canvas.width) {
                ball.vx *= -1;
                ball.x = Math.max(ball.radius, Math.min(canvas.width - ball.radius, ball.x));
            }

            if (ball.y - ball.radius < 0) {
                ball.vy *= -1;
                ball.y = ball.radius;
            }

            // Ball collision with paddle
            if (
                ball.y + ball.radius > paddle.y &&
                ball.y - ball.radius < paddle.y + paddle.height &&
                ball.x > paddle.x &&
                ball.x < paddle.x + paddle.width
            ) {
                ball.vy = -Math.abs(ball.vy);
                ball.y = paddle.y - ball.radius;
                ball.vx += (ball.x - (paddle.x + paddle.width / 2)) / 20;
                score++;
                scoreEl.textContent = `Score: ${score}`;
            }

            // Reset ball if it goes off bottom
            if (ball.y - ball.radius > canvas.height) {
                ball.x = canvas.width / 2;
                ball.y = canvas.height / 2;
                ball.vx = 4;
                ball.vy = -4;
                score = Math.max(0, score - 1);
                scoreEl.textContent = `Score: ${score}`;
            }

            // Increase ball speed slightly over time
            const speed = Math.sqrt(ball.vx ** 2 + ball.vy ** 2);
            if (speed < 8) {
                ball.vx *= 1.0005;
                ball.vy *= 1.0005;
            }
        }

        function draw() {
            // Clear
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw paddle
            ctx.fillStyle = '#0f0';
            ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);

            // Draw ball
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();

            // Draw center line
            ctx.strokeStyle = '#0f0';
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
